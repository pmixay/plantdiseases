<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-label="Inference pipeline: blur gate, leaf detector, classifier, calibration, OOD gate, diagnosis; plus the on-device Aqua tier"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2A6B46"/></marker><marker id="aha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#C47A12"/></marker></defs><rect width="1200" height="500" rx="18" fill="#F6F9F5" stroke="#B8C6BB"/><text x="32" y="42" font-size="22" font-weight="700" fill="#13201A" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">How a photo becomes a verdict</text><text x="32" y="68" font-size="16" fill="#2B3A31" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Two gates can refuse to answer — an honest "I can't tell" beats a confident wrong diagnosis.</text><text x="32" y="108" font-size="14" font-weight="700" letter-spacing="1.5" fill="#1B4D33" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">SERVER TIERS  ·  gamma (default)  ·  frontier (opt-in)</text><rect x="39" y="122" width="172" height="100" rx="12" fill="#fff" stroke="#B8C6BB" stroke-width="1.6"/><text x="125.0" y="152" text-anchor="middle" font-size="17" font-weight="700" fill="#13201A" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Phone photo</text><text x="125.0" y="176" text-anchor="middle" font-size="14" fill="#2B3A31" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">camera or gallery</text><text x="125.0" y="196" text-anchor="middle" font-size="14" fill="#2B3A31" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">EXIF-normalised</text><rect x="229" y="122" width="172" height="100" rx="12" fill="#FFF6E3" stroke="#C47A12" stroke-width="1.6"/><text x="315.0" y="152" text-anchor="middle" font-size="17" font-weight="700" fill="#13201A" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Blur gate</text><text x="315.0" y="176" text-anchor="middle" font-size="14" fill="#2B3A31" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Laplacian variance</text><text x="315.0" y="196" text-anchor="middle" font-size="14" fill="#2B3A31" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">floor 50 @ 320 px</text><rect x="419" y="122" width="172" height="100" rx="12" fill="#E4F1E8" stroke="#2A6B46" stroke-width="1.6"/><text x="505.0" y="152" text-anchor="middle" font-size="17" font-weight="700" fill="#13201A" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Stage 1 · detector</text><text x="505.0" y="176" text-anchor="middle" font-size="14" fill="#2B3A31" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">YOLOv8n, one class</text><text x="505.0" y="196" text-anchor="middle" font-size="14" fill="#2B3A31" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">→ tight leaf crops</text><rect x="609" y="122" width="172" height="100" rx="12" fill="#E4F1E8" stroke="#2A6B46" stroke-width="1.6"/><text x="695.0" y="152" text-anchor="middle" font-size="17" font-weight="700" fill="#13201A" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Stage 2 · classifier</text><text x="695.0" y="176" text-anchor="middle" font-size="14" fill="#2B3A31" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">DINOv2 ViT-S/14 + LoRA</text><text x="695.0" y="196" text-anchor="middle" font-size="14" fill="#2B3A31" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">+ MLP head, 9 classes</text><rect x="799" y="122" width="172" height="100" rx="12" fill="#E4F1E8" stroke="#2A6B46" stroke-width="1.6"/><text x="885.0" y="152" text-anchor="middle" font-size="17" font-weight="700" fill="#13201A" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Calibration</text><text x="885.0" y="176" text-anchor="middle" font-size="14" fill="#2B3A31" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">temperature scaling</text><text x="885.0" y="196" text-anchor="middle" font-size="14" fill="#2B3A31" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">+ RAPS conformal set</text><rect x="989" y="122" width="172" height="100" rx="12" fill="#FFF6E3" stroke="#C47A12" stroke-width="1.6"/><text x="1075.0" y="152" text-anchor="middle" font-size="17" font-weight="700" fill="#13201A" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">OOD AND-gate</text><text x="1075.0" y="176" text-anchor="middle" font-size="14" fill="#2B3A31" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">detector ∧ k-NN dist.</text><text x="1075.0" y="196" text-anchor="middle" font-size="14" fill="#2B3A31" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">∧ no not_a_plant veto</text><path d="M212 172.0L226 172.0" stroke="#2A6B46" stroke-width="2" fill="none" marker-end="url(#ah)"/><path d="M402 172.0L416 172.0" stroke="#2A6B46" stroke-width="2" fill="none" marker-end="url(#ah)"/><path d="M592 172.0L606 172.0" stroke="#2A6B46" stroke-width="2" fill="none" marker-end="url(#ah)"/><path d="M782 172.0L796 172.0" stroke="#2A6B46" stroke-width="2" fill="none" marker-end="url(#ah)"/><path d="M972 172.0L986 172.0" stroke="#2A6B46" stroke-width="2" fill="none" marker-end="url(#ah)"/><text x="695.0" y="244" text-anchor="middle" font-size="14" fill="#2B3A31" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">mean vote: top crops + whole frame</text><rect x="609" y="282" width="552" height="76" rx="12" fill="#2A6B46" stroke="#1B4D33" stroke-width="1.6"/><text x="885.0" y="312" text-anchor="middle" font-size="17" font-weight="700" fill="#fff" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Bilingual diagnosis (EN / RU)</text><text x="885.0" y="336" text-anchor="middle" font-size="14" fill="#fff" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">class · calibrated confidence · top-3 · prediction set · care plan</text><path d="M885.0 226L885.0 279" stroke="#2A6B46" stroke-width="2" fill="none" marker-end="url(#ah)"/><path d="M1075.0 226L1075.0 279" stroke="#2A6B46" stroke-width="2" fill="none" marker-end="url(#ah)"/><text x="1065.0" y="254" text-anchor="end" font-size="14" fill="#7A4A06" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">OOD hit → abstain,</text><text x="1065.0" y="272" text-anchor="end" font-size="14" fill="#7A4A06" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">probabilities untouched</text><rect x="225" y="282" width="180" height="76" rx="12" fill="#FFF6E3" stroke="#C47A12" stroke-width="1.6"/><text x="315.0" y="312" text-anchor="middle" font-size="17" font-weight="700" fill="#7A4A06" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Abstain</text><text x="315.0" y="336" text-anchor="middle" font-size="14" fill="#7A4A06" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">image_quality — retake</text><path d="M315.0 226L315.0 279" stroke="#C47A12" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#aha)"/><line x1="32" y1="378" x2="1168" y2="378" stroke="#B8C6BB" stroke-dasharray="4 4"/><text x="32" y="400" font-size="14" font-weight="700" letter-spacing="1.5" fill="#1B4D33" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">ON-DEVICE TIER  ·  aqua (no network)</text><rect x="32" y="412" width="210" height="60" rx="12" fill="#fff" stroke="#B8C6BB" stroke-width="1.6"/><text x="137.0" y="448" text-anchor="middle" font-size="15" font-weight="700" fill="#13201A" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Phone photo</text><rect x="272" y="412" width="210" height="60" rx="12" fill="#FFF6E3" stroke="#C47A12" stroke-width="1.6"/><text x="377.0" y="448" text-anchor="middle" font-size="15" font-weight="700" fill="#13201A" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Blur gate (same floor)</text><rect x="512" y="412" width="210" height="60" rx="12" fill="#E4F1E8" stroke="#2A6B46" stroke-width="1.6"/><text x="617.0" y="448" text-anchor="middle" font-size="15" font-weight="700" fill="#13201A" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">MobileNetV3-Small · TFLite</text><rect x="752" y="412" width="210" height="60" rx="12" fill="#2A6B46" stroke="#1B4D33" stroke-width="1.6"/><text x="857.0" y="448" text-anchor="middle" font-size="15" font-weight="700" fill="#fff" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">Offline diagnosis</text><path d="M243 442.0L269 442.0" stroke="#2A6B46" stroke-width="2" fill="none" marker-end="url(#ah)"/><path d="M483 442.0L509 442.0" stroke="#2A6B46" stroke-width="2" fill="none" marker-end="url(#ah)"/><path d="M723 442.0L749 442.0" stroke="#2A6B46" stroke-width="2" fill="none" marker-end="url(#ah)"/><text x="978" y="438" font-size="14" fill="#2B3A31" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">distilled from gamma;</text><text x="978" y="458" font-size="14" fill="#2B3A31" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">downloaded once, cached</text></svg>

name: cleanup-artifacts

# Frees Actions storage by deleting old build artifacts (the "Artifact storage
# quota has been hit" failures came from 90-day-default reports/APKs piling up).
# Runs daily and can be triggered manually with a custom age.
on:
  schedule:
    - cron: "0 4 * * *"   # daily 04:00 UTC
  workflow_dispatch:
    inputs:
      days:
        description: "Delete artifacts older than this many days"
        default: "30"
        required: false

permissions:
  actions: write   # required to DELETE artifacts

concurrency:
  group: cleanup-artifacts
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete artifacts older than N days
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DAYS: ${{ github.event.inputs.days || '30' }}
        run: |
          set -euo pipefail
          cutoff=$(date -u -d "-${DAYS} days" +%s)
          echo "Deleting artifacts created before $(date -u -d "@${cutoff}") (>${DAYS}d) in ${REPO}"
          # Collect first (deleting shifts pagination), then remove.
          mapfile -t rows < <(gh api --paginate \
            "repos/${REPO}/actions/artifacts" \
            --jq ".artifacts[] | select((.created_at|fromdateiso8601) < ${cutoff}) | \"\(.id)\t\(.size_in_bytes)\t\(.name)\t\(.created_at)\"")
          echo "Found ${#rows[@]} artifact(s) to delete."
          freed=0
          for row in "${rows[@]:-}"; do
            [ -z "${row}" ] && continue
            id=$(cut -f1 <<<"$row"); size=$(cut -f2 <<<"$row")
            name=$(cut -f3 <<<"$row"); created=$(cut -f4 <<<"$row")
            echo "  delete id=${id} name=${name} created=${created} size=$((size/1024/1024))MB"
            if gh api -X DELETE "repos/${REPO}/actions/artifacts/${id}"; then
              freed=$((freed + size))
            else
              echo "  (skip: already gone or not deletable)"
            fi
          done
          echo "Done. Freed ~$((freed/1024/1024)) MB across ${#rows[@]} artifact(s)."

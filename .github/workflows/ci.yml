name: ci

on:
  # Pushes from the repo-owned automation branches get immediate CI before a
  # PR is opened. `codex/**` matched nothing until 2026-08-03, so work merged
  # from those branches (#136, #137) reached main with no CI at all — which is
  # how four auto-fixable lint errors blocked the Android suite for two days.
  push:
    branches: [main, account-beta-test, "claude/**", "work/**", "codex/**"]

# Least privilege for GITHUB_TOKEN. Without this the token inherits the
# repository/organization default, which on many repos is still read-write on
# contents, packages, issues and pull-requests — handed to every third-party
# action and to the Gradle build. Nothing in this workflow writes to the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.filter.outputs.android }}
      account: ${{ steps.filter.outputs.account }}
      server: ${{ steps.filter.outputs.server }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # A workflow change intentionally selects every filter. This gives a
          # final CI-gate commit a complete matrix before APK distribution.
          filters: |
            android:
              - 'android/**'
              - '.github/workflows/ci.yml'
            account:
              - 'account-server/**'
              - 'deploy/account-beta-test/**'
              - '.github/workflows/ci.yml'
            server:
              - 'server/**'
              - '.github/workflows/ci.yml'

  android:
    name: Android build & lint
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    # NOTE: the release-signing and FCM secrets are deliberately NOT declared
    # here. A job-level `env:` block is injected into the process environment of
    # EVERY step, including `actions/checkout`, `setup-java`,
    # `android-actions/setup-android` and `gradle/actions/*` — third-party code
    # that has no business holding the app-signing key. Each secret is now
    # attached to the single step that needs it (see below).
    steps:
      - uses: actions/checkout@v7
        with:
          # Stops checkout from writing the GITHUB_TOKEN into .git/config, where
          # it stays readable by every subsequent step — including the Gradle
          # build and its plugins.
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: latest

      # Presence check only. The private values are scoped to this step and
      # never printed; later steps branch on a boolean. The expected SHA-256
      # certificate digest is public and pins CI to the one permanent
      # com.plantdiseases.app signing identity.
      - name: Detect permanent app signing config
        id: signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
        run: |
          if [ -n "${RELEASE_KEYSTORE_BASE64:-}" ] && \
             [ -n "${RELEASE_STORE_PASSWORD:-}" ] && \
             [ -n "${RELEASE_KEY_ALIAS:-}" ] && \
             [ -n "${RELEASE_KEY_PASSWORD:-}" ] && \
             [ -n "${RELEASE_CERT_SHA256:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      # Presence check only. Real provider values stay scoped to this step and
      # the eventual real staging build step; all other actions and Gradle tasks
      # see only booleans.
      - name: Detect real OAuth config
        id: real_oauth
        env:
          YANDEX_CLIENT_ID: ${{ secrets.YANDEX_CLIENT_ID }}
          VKID_CLIENT_ID: ${{ secrets.VKID_CLIENT_ID }}
          VKID_CLIENT_SECRET: ${{ secrets.VKID_CLIENT_SECRET }}
        run: |
          if [ -n "${YANDEX_CLIENT_ID:-}" ] && \
             [ -n "${VKID_CLIENT_ID:-}" ] && \
             [ -n "${VKID_CLIENT_SECRET:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      # gradle-wrapper.jar is committed executable code that runs before the
      # build — and, further down, alongside the signing secrets. Validate it
      # against Gradle's published known-good checksums so a swapped-in wrapper
      # cannot silently exfiltrate them. The action scans the whole checkout, so
      # it finds android/gradle/ regardless of this job's
      # `defaults.run.working-directory` (which applies to `run:` steps only).
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      # Restores the Gradle home (dependencies + local build cache) and reuses
      # it across runs, so unchanged modules/tasks aren't recompiled. Replaces
      # the hand-rolled actions/cache step and manages the Gradle daemon.
      # Pinned to v6 (latest): v5+ runs on Node 24, clearing the Node 20
      # runtime deprecation warning that v4 emitted.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      # Decode the upload keystore from a secret only when one is configured.
      - name: Decode permanent app keystore
        if: steps.signing.outputs.configured == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      # Compile and execute the staging identity test once with inert
      # client values. This proves the official SDK mode and its BuildConfig
      # branch stay buildable without putting real provider values in CI.
      - name: Verify real OAuth staging build mode
        env:
          ACCOUNT_REAL_OAUTH: "true"
          YANDEX_CLIENT_ID: ci-yandex-placeholder
          VKID_CLIENT_ID: "12345"
          VKID_CLIENT_SECRET: ci-vk-mobile-placeholder
          APP_API_BASE_URL: https://app-api.invalid/
          ACCOUNT_API_BASE_URL: https://account-api.invalid/
        run: >-
          ./gradlew :app:testStagingUnitTest
          --build-cache --configuration-cache --stacktrace

      # One Gradle invocation runs lint, both unit-test variants, the R8 release
      # package, and the same-identity staging package while sharing a single
      # configuration phase and warm daemon. With
      # RELEASE_STORE_FILE set the release APK uses that key; otherwise it falls
      # back to the debug key for non-distributable contributor builds.
      - name: Lint, test production + staging, and assemble both APKs
        env:
          RELEASE_STORE_FILE: ${{ steps.signing.outputs.configured == 'true' && format('{0}/release.keystore', runner.temp) || '' }}
          # Scoped to this step: the Gradle build is the only thing that needs
          # to read them (app/build.gradle.kts signProp/fcmProp).
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          # FCM client config (optional). Unset ⇒ push stays dormant and the
          # client falls back to polling (PushManager.isConfigured).
          FCM_APP_ID: ${{ secrets.FCM_APP_ID }}
          FCM_API_KEY: ${{ secrets.FCM_API_KEY }}
          FCM_PROJECT_ID: ${{ secrets.FCM_PROJECT_ID }}
          FCM_SENDER_ID: ${{ secrets.FCM_SENDER_ID }}
        # ktlint + detekt replace Android Lint as the code-quality gate.
        # --configuration-cache reuses the resolved task graph across runs (the
        # cache itself is restored by gradle/actions/setup-gradle), skipping the
        # configuration phase when nothing structural changed.
        run: >-
          ./gradlew ktlintCheck detekt testDebugUnitTest
          testStagingUnitTest assembleRelease assembleStaging
          --build-cache --configuration-cache --stacktrace

      - name: Require real OAuth and permanent signing for PlantDiseases 1.9 staging artifact
        if: >-
          github.ref == 'refs/heads/account-beta-test' &&
          (steps.real_oauth.outputs.configured != 'true' ||
          steps.signing.outputs.configured != 'true')
        run: |
          echo "::error::This branch publishes only PlantDiseases 1.9 with real OAuth and the permanent com.plantdiseases.app certificate. Configure YANDEX_CLIENT_ID, VKID_CLIENT_ID, VKID_CLIENT_SECRET, all RELEASE_* secrets, and the RELEASE_CERT_SHA256 repository variable."
          exit 1

      # Rebuild PlantDiseases 1.9 staging with the actual provider
      # applications and fixed parallel German endpoints. This overwrites only
      # the staging output produced above; release/main remains untouched.
      - name: Assemble real-OAuth PlantDiseases 1.9 staging APK
        if: >-
          github.ref == 'refs/heads/account-beta-test' &&
          steps.real_oauth.outputs.configured == 'true' &&
          steps.signing.outputs.configured == 'true'
        env:
          ACCOUNT_REAL_OAUTH: "true"
          YANDEX_CLIENT_ID: ${{ secrets.YANDEX_CLIENT_ID }}
          VKID_CLIENT_ID: ${{ secrets.VKID_CLIENT_ID }}
          VKID_CLIENT_SECRET: ${{ secrets.VKID_CLIENT_SECRET }}
          APP_API_BASE_URL: https://pdis.arbuz.lol/plantdisease-test/
          ACCOUNT_API_BASE_URL: https://pdis.arbuz.lol/plantdisease-test/id/
          RELEASE_STORE_FILE: ${{ format('{0}/release.keystore', runner.temp) }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: >-
          ./gradlew :app:testStagingUnitTest :app:assembleStaging
          --build-cache --stacktrace

      # A production release is also the same package/certificate. Rebuild it
      # with the real provider configuration only on main; ordinary branch
      # builds remain non-distributable compilation evidence.
      - name: Assemble real-OAuth PlantDiseases 1.9 production APK
        if: >-
          github.ref == 'refs/heads/main' &&
          steps.real_oauth.outputs.configured == 'true' &&
          steps.signing.outputs.configured == 'true'
        env:
          ACCOUNT_REAL_OAUTH: "true"
          YANDEX_CLIENT_ID: ${{ secrets.YANDEX_CLIENT_ID }}
          VKID_CLIENT_ID: ${{ secrets.VKID_CLIENT_ID }}
          VKID_CLIENT_SECRET: ${{ secrets.VKID_CLIENT_SECRET }}
          APP_API_BASE_URL: https://pdis.arbuz.lol/
          ACCOUNT_API_BASE_URL: https://pdis.arbuz.lol/id/
          RELEASE_STORE_FILE: ${{ format('{0}/release.keystore', runner.temp) }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: >-
          ./gradlew :app:assembleRelease --build-cache --stacktrace

      # Prove the release and real-OAuth staging APKs use the configured permanent
      # certificate instead of silently falling back to the debug key, and
      # report whether the FCM client config was injected — without printing
      # the secret values. Fails the build if a keystore secret is set but the
      # APK ended up debug-signed (i.e. a signing misconfiguration).
      - name: Verify APK signing & FCM config
        env:
          # Boolean only — the keystore blob itself is not in scope here.
          RELEASE_CONFIGURED: ${{ steps.signing.outputs.configured }}
          RELEASE_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
        run: |
          set -eu
          apk=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "APK: $apk"
          apksigner=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort -V | tail -1)
          certs=$("$apksigner" verify --print-certs "$apk")
          echo "----- signing certificate -----"
          echo "$certs"
          echo "--------------------------------"

          # FCM: report configured/not from the generated BuildConfig without
          # echoing the values themselves.
          bc=$(find app/build/generated -name BuildConfig.java -path '*release*' | head -1 || true)
          if [ -n "$bc" ] && grep -q 'FCM_API_KEY = "";' "$bc"; then
            echo "FCM: NOT configured (FCM_* are empty → push stays dormant)"
          elif [ -n "$bc" ]; then
            echo "FCM: configured (FCM_* injected into BuildConfig)"
          else
            echo "FCM: release BuildConfig.java not found"
          fi

          if [ "${RELEASE_CONFIGURED:-false}" = "true" ]; then
            if echo "$certs" | grep -q "CN=Android Debug"; then
              echo "::error::RELEASE_KEYSTORE_BASE64 is set but the APK is debug-signed"
              exit 1
            fi
            release_sha=$(echo "$certs" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)
            expected_sha=$(printf '%s' "$RELEASE_CERT_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')
            expected_sha=${expected_sha#sha256}
            normalized_release_sha=$(printf '%s' "$release_sha" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')
            if [ -z "$normalized_release_sha" ] || [ "$normalized_release_sha" != "$expected_sha" ]; then
              echo "::error::Release APK certificate does not match the pinned RELEASE_CERT_SHA256"
              exit 1
            fi
            echo "OK: release APK uses the pinned permanent app certificate."

            if [ "${{ github.ref }}" = "refs/heads/account-beta-test" ]; then
              staging_apk=$(find app/build/outputs/apk/staging -name '*.apk' | head -1)
              staging_certs=$("$apksigner" verify --print-certs "$staging_apk")
              echo "----- staging signing certificate -----"
              echo "$staging_certs"
              echo "---------------------------------------"
              staging_sha=$(echo "$staging_certs" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1)
              normalized_staging_sha=$(printf '%s' "$staging_sha" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')
              if [ -z "$normalized_staging_sha" ] || [ "$normalized_staging_sha" != "$expected_sha" ]; then
                echo "::error::Staging APK is not signed by the pinned permanent app certificate"
                exit 1
              fi
              echo "OK: staging uses the same pinned permanent app certificate."
            fi
          else
            echo "No release keystore secret set; debug-signed fallback is expected."
          fi

      - name: Upload ktlint + detekt reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: |
            android/app/build/reports/ktlint/**
            android/app/build/reports/detekt/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload unit test report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: |
            android/app/build/reports/tests/testDebugUnitTest/**
            android/app/build/reports/tests/testStagingUnitTest/**
            android/app/build/test-results/testDebugUnitTest/**
            android/app/build/test-results/testStagingUnitTest/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports
          path: |
            android/app/build/reports/**
            android/app/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload permanently signed real-OAuth production APK
        if: >-
          success() && github.ref == 'refs/heads/main' &&
          steps.real_oauth.outputs.configured == 'true' &&
          steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: plantdiseases-1.9-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 7
          # An APK is already a compressed zip, so the artifact wrapper's
          # deflate buys very little. Use a light level (3) — most of the small
          # gain at a fraction of the CPU of the default 6 — rather than 0.
          compression-level: 3

      - name: Upload real-OAuth PlantDiseases 1.9 staging APK
        if: >-
          success() && github.ref == 'refs/heads/account-beta-test' &&
          steps.real_oauth.outputs.configured == 'true' &&
          steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: plantdiseases-1.9-staging-apk
          path: android/app/build/outputs/apk/staging/*.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 3

  server:
    name: Server tests & lint
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-dev.txt

      - name: Install server + dev dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests (pytest)
        run: pytest tests -q

  account:
    name: Account API tests & lint
    needs: changes
    if: needs.changes.outputs.account == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: account-server
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            account-server/requirements.txt
            account-server/requirements-dev.txt

      - name: Install account API dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Validate local, German staging, and handoff configurations
        run: |
          docker compose -f ../deploy/account-beta-test/compose.local.yml config --quiet
          docker compose --env-file ../deploy/account-beta-test/env.german.example \
            -f ../deploy/account-beta-test/compose.german-vds.yml \
            -f ../deploy/account-beta-test/compose.german-vds.build.yml \
            config --quiet
          docker compose --env-file ../deploy/account-beta-test/handoff/env.production.example \
            -f ../deploy/account-beta-test/handoff/compose.russia.template.yml config --quiet
          docker compose --env-file ../deploy/account-beta-test/handoff/env.production.example \
            -f ../deploy/account-beta-test/handoff/compose.germany-worker.template.yml config --quiet
          sh -n ../deploy/account-beta-test/backup-test.sh

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests (pytest)
        run: pytest -q

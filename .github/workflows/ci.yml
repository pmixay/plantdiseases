name: ci

on:
  # Push-only. Work happens on claude/** branches, so a push already
  # covers both the pre-PR window and every later PR update — the check
  # runs attach to the commit and show on the PR. The pull_request
  # trigger was dropped because it re-ran the whole suite for the same
  # commit once a PR was open, doubling a commit's checks (push +
  # pull_request). Re-add `pull_request:` only if you need CI on PRs from
  # forks or branches that don't match the patterns below.
  push:
    branches: [main, master, "claude/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.filter.outputs.android }}
      server: ${{ steps.filter.outputs.server }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            android:
              - 'android/**'
              - '.github/workflows/ci.yml'
            server:
              - 'server/**'
              - '.github/workflows/ci.yml'

  android:
    name: Android build & lint
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      # Release signing (optional). Set these repo secrets to ship an APK
      # signed with your own upload key; leave them unset and the build falls
      # back to the debug key (installable for sideload). RELEASE_KEYSTORE_BASE64
      # is a base64-encoded .jks — see docs/ANDROID_RELEASE.md.
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      # Firebase Cloud Messaging client config (optional). Unset ⇒ push stays
      # dormant and the client falls back to polling (PushManager.isConfigured).
      FCM_APP_ID: ${{ secrets.FCM_APP_ID }}
      FCM_API_KEY: ${{ secrets.FCM_API_KEY }}
      FCM_PROJECT_ID: ${{ secrets.FCM_PROJECT_ID }}
      FCM_SENDER_ID: ${{ secrets.FCM_SENDER_ID }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: latest

      # Restores the Gradle home (dependencies + local build cache) and reuses
      # it across runs, so unchanged modules/tasks aren't recompiled. Replaces
      # the hand-rolled actions/cache step and manages the Gradle daemon.
      # Pinned to v6 (latest): v5+ runs on Node 24, clearing the Node 20
      # runtime deprecation warning that v4 emitted.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      # Decode the upload keystore from a secret only when one is configured.
      - name: Decode release keystore
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        run: echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      # One Gradle invocation runs lint + unit tests + the R8 release package,
      # sharing a single configuration phase and warm daemon (much faster than
      # three separate `--no-daemon` calls). Only the release variant is
      # packaged — it's the shipping artefact and the only build R8 can break
      # (e.g. a stripped Gson/Retrofit reflection class); lint/test already
      # compile the debug sources. With RELEASE_STORE_FILE set the APK is signed
      # with your key, otherwise it falls back to the debug key.
      - name: Lint, test & assemble release APK (R8)
        env:
          RELEASE_STORE_FILE: ${{ env.RELEASE_KEYSTORE_BASE64 != '' && format('{0}/release.keystore', runner.temp) || '' }}
        run: ./gradlew lintDebug testDebugUnitTest assembleRelease --build-cache --stacktrace

      # Prove the published APK is signed with the release key (when one is
      # configured) instead of silently falling back to the debug key, and
      # report whether the FCM client config was injected — without printing
      # the secret values. Fails the build if a keystore secret is set but the
      # APK ended up debug-signed (i.e. a signing misconfiguration).
      - name: Verify APK signing & FCM config
        run: |
          set -eu
          apk=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "APK: $apk"
          apksigner=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort -V | tail -1)
          certs=$("$apksigner" verify --print-certs "$apk")
          echo "----- signing certificate -----"
          echo "$certs"
          echo "--------------------------------"

          # FCM: report configured/not from the generated BuildConfig without
          # echoing the values themselves.
          bc=$(find app/build/generated -name BuildConfig.java -path '*release*' | head -1 || true)
          if [ -n "$bc" ] && grep -q 'FCM_API_KEY = "";' "$bc"; then
            echo "FCM: NOT configured (FCM_* are empty → push stays dormant)"
          elif [ -n "$bc" ]; then
            echo "FCM: configured (FCM_* injected into BuildConfig)"
          else
            echo "FCM: release BuildConfig.java not found"
          fi

          if [ -n "${RELEASE_KEYSTORE_BASE64:-}" ]; then
            if echo "$certs" | grep -q "CN=Android Debug"; then
              echo "::error::RELEASE_KEYSTORE_BASE64 is set but the APK is debug-signed"
              exit 1
            fi
            echo "OK: release APK is signed with the configured release key."
          else
            echo "No release keystore secret set; debug-signed fallback is expected."
          fi

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: |
            android/app/build/reports/lint-results-*.html
            android/app/build/reports/lint-results-*.xml
          if-no-files-found: ignore

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: |
            android/app/build/reports/tests/testDebugUnitTest/**
            android/app/build/test-results/testDebugUnitTest/**
          if-no-files-found: ignore

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports
          path: |
            android/app/build/reports/**
            android/app/build/outputs/logs/**
          if-no-files-found: ignore

      - name: Upload release APK (R8, signed with release or debug key)
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

  server:
    name: Server tests & lint
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-dev.txt

      - name: Install CPU-only PyTorch
        run: |
          pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install server + dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests (pytest)
        run: pytest tests -q

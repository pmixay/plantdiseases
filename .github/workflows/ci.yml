name: ci

on:
  # Pushes from the repo-owned automation branches get immediate CI before a
  # PR is opened. `codex/**` matched nothing until 2026-08-03, so work merged
  # from those branches (#136, #137) reached main with no CI at all — which is
  # how four auto-fixable lint errors blocked the Android suite for two days.
  push:
    branches: [main, "claude/**", "work/**", "codex/**"]

# Push-only, deliberately — there is no `pull_request` trigger. Every branch
# that reaches a PR here is pushed to one of the globs above first, so a PR
# trigger would only duplicate runs (a PR event lands under a different
# `github.ref`, so `concurrency` does not cancel the push run).
#
# The failure mode to keep in mind is the one that hit #158-#167: those came
# from automated branches that matched none of the globs, so each PR carried
# an EMPTY status and merged unbuilt — five mutually-incompatible dependency
# bumps that broke the Android build at Gradle configuration time on main.
# That specific hole is closed by the bot being gone (dependency updates are
# manual now), NOT by the trigger list. If any automation is reintroduced,
# add its branch prefix here in the same commit, or its PRs will be green by
# virtue of never having run.

# Least privilege for GITHUB_TOKEN. Without this the token inherits the
# repository/organization default, which on many repos is still read-write on
# contents, packages, issues and pull-requests — handed to every third-party
# action and to the Gradle build. Nothing in this workflow writes to the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.filter.outputs.android }}
      server: ${{ steps.filter.outputs.server }}
    steps:
      # fetch-depth: 0 is load-bearing, not a nicety. On a `push` event
      # paths-filter diffs against `github.event.before`, and with the default
      # depth-1 checkout that commit is not in the clone — so paths-filter
      # shells out to `git fetch` to get it. That fetch has no credentials
      # (persist-credentials: false, correctly, keeps the token out of
      # .git/config) and dies with:
      #   fatal: could not read Username for 'https://github.com'
      # which failed the `changes` job and, through `needs:`, SKIPPED the
      # android and server jobs entirely. Every push to main since #158 was
      # "green" only because nothing ever ran.
      #
      # Fetching the full history makes the base commit already present, so
      # paths-filter never fetches and never needs a credential. The
      # alternative — re-enabling persist-credentials here — would put the
      # token back in .git/config to work around a missing object; this keeps
      # the hardening and fixes the actual cause. A partial clone (filter:
      # blob:none) would shave a few seconds but reintroduces lazy fetches
      # against that same credential-less remote, so it stays a full clone.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            android:
              - 'android/**'
              - '.github/workflows/ci.yml'
            server:
              - 'server/**'
              - '.github/workflows/ci.yml'

  android:
    name: Android build & lint
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    # NOTE: the release-signing and FCM secrets are deliberately NOT declared
    # here. A job-level `env:` block is injected into the process environment of
    # EVERY step, including `actions/checkout`, `setup-java`,
    # `android-actions/setup-android` and `gradle/actions/*` — third-party code
    # that has no business holding the app-signing key. Each secret is now
    # attached to the single step that needs it (see below).
    steps:
      - uses: actions/checkout@v7
        with:
          # Stops checkout from writing the GITHUB_TOKEN into .git/config, where
          # it stays readable by every subsequent step — including the Gradle
          # build and its plugins.
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # The runner image already ships the Android SDK: cmdline-tools/latest,
      # build-tools (apksigner) and the platforms this build compiles against.
      # So this step exists for ONE reason — accepting the SDK licences, which
      # is what lets AGP fetch a platform itself if the image ever drifts
      # behind compileSdk. Both inputs below are non-default and deliberate:
      #
      #   packages: ''  — the default is `tools platform-tools`, and `tools` is
      #     SDK Tools 26.0.0: monkeyrunner, hierarchyviewer, jython, SWT, the
      #     old `android` script. Deprecated for years, ~15s to download and
      #     unzip every run, and touched by neither an AGP build nor apksigner.
      #     platform-tools (adb) is only for on-device work, which CI never
      #     does — connectedDebugAndroidTest is deliberately not run here.
      #   log-accepted-android-sdk-licenses: false — the licences are still
      #     accepted, just not echoed. The default dumped ~1,000 lines of
      #     Google TV and Android XR licence text over the build output.
      #
      # Together these took the step from 21s to 7s.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: latest
          packages: ''
          log-accepted-android-sdk-licenses: false

      # Presence check only. The secret is scoped to this step and never
      # leaves it; later steps branch on the boolean output instead, so the
      # keystore blob is not in scope for the build or the verify step.
      - name: Detect release signing config
        id: signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${RELEASE_KEYSTORE_BASE64:-}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      # gradle-wrapper.jar is committed executable code that runs before the
      # build — and, further down, alongside the signing secrets. Validate it
      # against Gradle's published known-good checksums so a swapped-in wrapper
      # cannot silently exfiltrate them. The action scans the whole checkout, so
      # it finds android/gradle/ regardless of this job's
      # `defaults.run.working-directory` (which applies to `run:` steps only).
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      # Restores the Gradle home (dependencies + local build cache) and reuses
      # it across runs, so unchanged modules/tasks aren't recompiled. Replaces
      # the hand-rolled actions/cache step and manages the Gradle daemon.
      # Pinned to v6 (latest): v5+ runs on Node 24, clearing the Node 20
      # runtime deprecation warning that v4 emitted.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # Robolectric resolves its `android-all-instrumented` jars at TEST
      # RUNTIME through its own Maven resolver, into ~/.m2/repository — not
      # through Gradle, so setup-gradle's Gradle-home cache never covered them
      # and every run re-downloaded the lot. Measured at 338 MB on the first
      # run that saved this entry. Scoped to org/robolectric so it cannot
      # collide with the settings.xml/toolchains.xml setup-java writes beside
      # it. Keyed on build.gradle.kts (where the Robolectric version lives) so
      # a version bump refreshes it, with a prefix restore-key so an unrelated
      # edit to that file still restores the jars.
      - name: Cache Robolectric android-all jars
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('android/app/build.gradle.kts') }}
          restore-keys: robolectric-${{ runner.os }}-

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      # Decode the upload keystore from a secret only when one is configured.
      - name: Decode release keystore
        if: steps.signing.outputs.configured == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      # One Gradle invocation runs lint + unit tests + the R8 release package,
      # sharing a single configuration phase and warm daemon. Gradle overlaps
      # these more than the serial-looking log suggests — a --profile run of a
      # cold build summed 15m44 of task time into 9m33 of wall clock, because
      # AGP submits work as async workers. The shape of that cold build, worth
      # knowing before trying to speed this up again:
      #
      #   minifyReleaseWithR8        5m08   <- the critical path
      #   testDebugUnitTest          2m34   (runs alongside R8)
      #   compileDebugKotlin         1m58
      #   compileReleaseKotlin       1m58
      #   kspDebugKotlin / Release   0m43 / 0m37
      #
      # So R8 is the tail, it already overlaps the tests, and on a two-core
      # runner everything else is competing with it for CPU. The remaining
      # levers are giving R8 its own runner (a second job) or not packaging
      # the release APK on every branch push — both trade away something this
      # workflow deliberately keeps. Only the release variant is packaged — it's the shipping
      # artefact and the only build R8 can break (e.g. a stripped Gson /
      # kotlinx.serialization reflection class); lint/test already compile the
      # debug sources. With RELEASE_STORE_FILE set the APK is signed with your
      # key, otherwise it falls back to the debug key.
      - name: ktlint, detekt, test & assemble release APK (R8)
        env:
          RELEASE_STORE_FILE: ${{ steps.signing.outputs.configured == 'true' && format('{0}/release.keystore', runner.temp) || '' }}
          # Scoped to this step: the Gradle build is the only thing that needs
          # to read them (app/build.gradle.kts signProp/fcmProp).
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          # FCM client config (optional). Unset ⇒ push stays dormant and the
          # client falls back to polling (PushManager.isConfigured).
          FCM_APP_ID: ${{ secrets.FCM_APP_ID }}
          FCM_API_KEY: ${{ secrets.FCM_API_KEY }}
          FCM_PROJECT_ID: ${{ secrets.FCM_PROJECT_ID }}
          FCM_SENDER_ID: ${{ secrets.FCM_SENDER_ID }}
        # ktlint + detekt replace Android Lint as the code-quality gate.
        # --configuration-cache is a compatibility gate here rather than a
        # speed win: the entry lives in the project's own .gradle/ directory,
        # which setup-gradle does not cache, so CI stores one every run and
        # restores none ("Calculating task graph as no cached configuration is
        # available" on every build). Caching it would mean handing
        # gradle/actions a `cache-encryption-key`, and a config-cache entry can
        # capture values read during configuration — including the signing
        # properties — so that key cannot live in the workflow. Kept because
        # Gradle 10 makes the config cache mandatory and this is what catches
        # an incompatible change on the commit that introduces it.
        run: ./gradlew ktlintCheck detekt testDebugUnitTest assembleRelease --build-cache --configuration-cache --stacktrace

      # Prove the published APK is signed with the release key (when one is
      # configured) instead of silently falling back to the debug key, and
      # report whether the FCM client config was injected — without printing
      # the secret values. Fails the build if a keystore secret is set but the
      # APK ended up debug-signed (i.e. a signing misconfiguration).
      - name: Verify APK signing & FCM config
        env:
          # Boolean only — the keystore blob itself is not in scope here.
          RELEASE_CONFIGURED: ${{ steps.signing.outputs.configured }}
        run: |
          set -eu
          apk=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "APK: $apk"
          apksigner=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort -V | tail -1)
          certs=$("$apksigner" verify --print-certs "$apk")
          echo "----- signing certificate -----"
          echo "$certs"
          echo "--------------------------------"

          # FCM: report configured/not from the generated BuildConfig without
          # echoing the values themselves.
          bc=$(find app/build/generated -name BuildConfig.java -path '*release*' | head -1 || true)
          if [ -n "$bc" ] && grep -q 'FCM_API_KEY = "";' "$bc"; then
            echo "FCM: NOT configured (FCM_* are empty → push stays dormant)"
          elif [ -n "$bc" ]; then
            echo "FCM: configured (FCM_* injected into BuildConfig)"
          else
            echo "FCM: release BuildConfig.java not found"
          fi

          if [ "${RELEASE_CONFIGURED:-false}" = "true" ]; then
            if echo "$certs" | grep -q "CN=Android Debug"; then
              echo "::error::RELEASE_KEYSTORE_BASE64 is set but the APK is debug-signed"
              exit 1
            fi
            echo "OK: release APK is signed with the configured release key."
          else
            echo "No release keystore secret set; debug-signed fallback is expected."
          fi

      # One artifact, not three. This used to be an upload of the ktlint +
      # detekt reports, then one of the test reports, then one of
      # `app/build/reports/**` — which is a superset of the first two. Only the
      # JUnit XML and the packaging logs live outside build/reports, so those
      # are the two extra paths.
      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-build-reports
          path: |
            android/app/build/reports/**
            android/app/build/test-results/**
            android/app/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload release APK (R8, signed with release or debug key)
        uses: actions/upload-artifact@v7
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 7
          # An APK is already a compressed zip, so the artifact wrapper's
          # deflate buys very little. Use a light level (3) — most of the small
          # gain at a fraction of the CPU of the default 6 — rather than 0.
          compression-level: 3

  server:
    name: Server tests & lint (py3.14)
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The server is deployed straight onto a host (`start.sh` → uvicorn),
      # so the interpreter is whatever `python3` resolves to there rather
      # than something a base image pins. We stand at the single current
      # release (3.14) instead of testing a floor+latest range — this
      # assumes deploy hosts track the latest interpreter rather than
      # staying pinned to an older one. If that assumption stops holding,
      # reintroduce a floor leg here (and in requirements.txt's numpy floor
      # / pyproject.toml's ruff target-version, which moved in lockstep).
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-dev.txt

      # No `pip install --upgrade pip` first: setup-python ships a current pip
      # and the upgrade only bought a wheel download and a version check.
      - name: Install server + dev dependencies
        run: pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests (pytest)
        run: pytest tests -q

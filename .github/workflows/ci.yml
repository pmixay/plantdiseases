name: ci

on:
  # Pushes from the repo-owned automation branches get immediate CI before a
  # PR is opened. `codex/**` matched nothing until 2026-08-03, so work merged
  # from those branches (#136, #137) reached main with no CI at all — which is
  # how four auto-fixable lint errors blocked the Android suite for two days.
  push:
    branches: [main, account-beta-test, "claude/**", "work/**", "codex/**"]

# Push-only, deliberately — there is no `pull_request` trigger. Every branch
# that reaches a PR here is pushed to one of the globs above first, so a PR
# trigger would only duplicate runs (a PR event lands under a different
# `github.ref`, so `concurrency` does not cancel the push run).
#
# The failure mode to keep in mind is the one that hit #158-#167: those came
# from automated branches that matched none of the globs, so each PR carried
# an EMPTY status and merged unbuilt — five mutually-incompatible dependency
# bumps that broke the Android build at Gradle configuration time on main.
# That specific hole is closed by the bot being gone (dependency updates are
# manual now), NOT by the trigger list. If any automation is reintroduced,
# add its branch prefix here in the same commit, or its PRs will be green by
# virtue of never having run.

# Least privilege for GITHUB_TOKEN. Without this the token inherits the
# repository/organization default, which on many repos is still read-write on
# contents, packages, issues and pull-requests — handed to every third-party
# action and to the Gradle build. Nothing in this workflow writes to the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.filter.outputs.android }}
      account: ${{ steps.filter.outputs.account }}
      server: ${{ steps.filter.outputs.server }}
    steps:
      # fetch-depth: 0 is load-bearing, not a nicety. On a `push` event
      # paths-filter diffs against `github.event.before`, and with the default
      # depth-1 checkout that commit is not in the clone — so paths-filter
      # shells out to `git fetch` to get it. That fetch has no credentials
      # (persist-credentials: false, correctly, keeps the token out of
      # .git/config) and dies with:
      #   fatal: could not read Username for 'https://github.com'
      # which failed the `changes` job and, through `needs:`, SKIPPED the
      # android and server jobs entirely. Every push to main since #158 was
      # "green" only because nothing ever ran.
      #
      # Fetching the full history makes the base commit already present, so
      # paths-filter never fetches and never needs a credential. The
      # alternative — re-enabling persist-credentials here — would put the
      # token back in .git/config to work around a missing object; this keeps
      # the hardening and fixes the actual cause.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          # A workflow change intentionally selects every filter. This gives a
          # final CI-gate commit a complete matrix before APK distribution.
          filters: |
            android:
              - 'android/**'
              - 'account-server/app/api/**'
              - 'account-server/app/security/tokens.py'
              - '.github/workflows/**'
              - 'DEPLOYMENT.md'
              - 'privacy.html'
              - 'docs/ANDROID_1_9_SIGNING_AND_OAUTH_REGISTRATION.md'
              - 'docs/ACCOUNT_BETA_FINAL_IMPLEMENTATION_GUIDE.md'
            account:
              - 'account-server/**'
              - 'deploy/account-beta-test/**'
              - 'server/**'
              - '.github/workflows/**'
              - 'DEPLOYMENT.md'
              - 'privacy.html'
              - 'docs/ACCOUNT_BETA_*.md'
              - 'docs/ANDROID_1_9_SIGNING_AND_OAUTH_REGISTRATION.md'
            server:
              - 'server/**'
              - 'account-server/**'
              - '.github/workflows/**'
              - 'DEPLOYMENT.md'
              - 'privacy.html'
              - 'docs/ACCOUNT_BETA_*.md'

  android:
    name: Android build & lint
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    # This job is deliberately credential-free. It produces compilation/test
    # evidence only; the protected manual workflow is the sole signing path.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Stops checkout from writing the GITHUB_TOKEN into .git/config, where
          # it stays readable by every subsequent step — including the Gradle
          # build and its plugins.
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          cmdline-tools-version: latest

      # gradle-wrapper.jar is committed executable code that runs before the
      # build. Validate it against Gradle's published known-good checksums. The
      # protected signing workflow repeats this check before loading secrets.
      # The action scans the whole checkout, so
      # it finds android/gradle/ regardless of this job's
      # `defaults.run.working-directory` (which applies to `run:` steps only).
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      # Restores the Gradle home (dependencies + local build cache) and reuses
      # it across runs, so unchanged modules/tasks aren't recompiled. Replaces
      # the hand-rolled actions/cache step and manages the Gradle daemon.
      # Pinned to v6 (latest): v5+ runs on Node 24, clearing the Node 20
      # runtime deprecation warning that v4 emitted.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-provider: basic

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      # Prove that a fresh checkout needs no endpoint/OAuth flags: committed
      # public defaults select the live beta pair and pinned Yandex client.
      - name: Verify zero-configuration Yandex beta build mode
        run: >-
          ./gradlew :app:testDebugUnitTest :app:testStagingUnitTest
          --build-cache --configuration-cache --stacktrace

      # Ordinary CI never receives permanent signing/provider credentials and
      # never produces a distributable APK. Release and same-package staging
      # signing live in the separately protected android-release workflow.
      - name: Lint, test release variants, and assemble non-distributable APKs
        # ktlint + detekt replace Android Lint as the code-quality gate.
        # --configuration-cache reuses the resolved task graph across runs (the
        # cache itself is restored by gradle/actions/setup-gradle), skipping the
        # configuration phase when nothing structural changed.
        run: >-
          ./gradlew ktlintCheck detekt testDebugUnitTest
          testStagingUnitTest testReleaseUnitTest testRecoveryProductionUnitTest
          testRecoveryStagingUnitTest assembleRelease assembleStaging
          assembleRecoveryProduction assembleRecoveryStaging
          --build-cache --configuration-cache --stacktrace

      - name: Upload ktlint + detekt reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lint-report
          path: |
            android/app/build/reports/ktlint/**
            android/app/build/reports/detekt/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload unit test report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unit-test-report
          path: |
            android/app/build/reports/tests/testDebugUnitTest/**
            android/app/build/reports/tests/testStagingUnitTest/**
            android/app/build/reports/tests/testReleaseUnitTest/**
            android/app/build/reports/tests/testRecoveryProductionUnitTest/**
            android/app/build/reports/tests/testRecoveryStagingUnitTest/**
            android/app/build/test-results/testDebugUnitTest/**
            android/app/build/test-results/testStagingUnitTest/**
            android/app/build/test-results/testReleaseUnitTest/**
            android/app/build/test-results/testRecoveryProductionUnitTest/**
            android/app/build/test-results/testRecoveryStagingUnitTest/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: build-reports
          path: |
            android/app/build/reports/**
            android/app/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7

  server:
    name: Server tests & lint (py3.14)
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The server is deployed straight onto a host (`start.sh` → uvicorn),
      # so the interpreter is whatever `python3` resolves to there rather
      # than something a base image pins. We stand at the single current
      # release (3.14) instead of testing a floor+latest range — this
      # assumes deploy hosts track the latest interpreter rather than
      # staying pinned to an older one. If that assumption stops holding,
      # reintroduce a floor leg here (and in requirements.txt's numpy floor
      # / pyproject.toml's ruff target-version, which moved in lockstep).
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-dev.txt

      - name: Install server + dev dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests (pytest)
        run: pytest tests -q

  account:
    name: Account API tests & lint
    needs: changes
    if: needs.changes.outputs.account == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine3.23@sha256:996d0920e4ff9df1fc19dacb904492f3c1ec0ec1cc338f0ad7123be7731c5f5e
        env:
          POSTGRES_DB: account_ci
          POSTGRES_USER: account_ci
          POSTGRES_PASSWORD: account-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U account_ci -d account_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      ENVIRONMENT: test
      AUTH_PROVIDER_MODE: mock
      ACCOUNT_ISSUER: http://127.0.0.1:18001
      ACCOUNT_AUDIENCE: plantdiseases-app
      ACCOUNT_DATABASE_URL: postgresql+psycopg://account_ci:account-ci-only@127.0.0.1:5432/account_ci
      ACCOUNT_POSTGRES_INTEGRATION_URL: postgresql+psycopg://account_ci:account-ci-only@127.0.0.1:5432/account_ci
      ACCOUNT_DATABASE_LOCAL: "true"
      ACCOUNT_ALLOW_EPHEMERAL_KEYS: "true"
    defaults:
      run:
        working-directory: account-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            account-server/requirements.txt
            account-server/requirements-dev.txt

      - name: Install account API dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Upgrade and verify the live PostgreSQL schema
        run: |
          alembic upgrade head
          alembic current

      - name: Validate local, German staging, and handoff configurations
        run: |
          docker compose -f ../deploy/account-beta-test/compose.local.yml config --quiet
          docker compose --env-file ../deploy/account-beta-test/env.german.example \
            -f ../deploy/account-beta-test/compose.german-vds.yml \
            -f ../deploy/account-beta-test/compose.german-vds.build.yml \
            config --quiet
          docker compose --env-file ../deploy/account-beta-test/handoff/env.production.example \
            -f ../deploy/account-beta-test/handoff/compose.russia-template.yml config --quiet
          docker compose --env-file ../deploy/account-beta-test/handoff/env.production.example \
            -f ../deploy/account-beta-test/handoff/compose.germany-worker-template.yml config --quiet
          bash -n ../deploy/account-beta-test/backup-test.sh
          sh -n ../deploy/account-beta-test/postgres-init/10-account-roles.sh
          sh -n ../deploy/account-beta-test/handoff/postgres-init/10-account-roles.sh

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests (pytest)
        run: pytest -q

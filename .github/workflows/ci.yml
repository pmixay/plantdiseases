name: ci

on:
  # Pushes from the repo-owned automation branches get immediate CI before a
  # PR is opened. `codex/**` matched nothing until 2026-08-03, so work merged
  # from those branches (#136, #137) reached main with no CI at all — which is
  # how four auto-fixable lint errors blocked the Android suite for two days.
  push:
    # `model-*` covers the maintainer's model-work branches (e.g. model-fix-test):
    # 9.5k lines of server/notebook changes reached that branch in 2026-08 with
    # no CI run because its name matched none of the globs above.
    # `ccr-*` is what Claude Code cloud sessions push to. The 2026-11 test
    # rework sat on one for a day with every Kotlin edit unbuilt because the
    # name matched nothing here.
    branches: [main, account-beta-test, "claude/**", "work/**", "codex/**", "model-*", "ccr-*"]

# Push-only, deliberately — there is no `pull_request` trigger. Every branch
# that reaches a PR here is pushed to one of the globs above first, so a PR
# trigger would only duplicate runs (a PR event lands under a different
# `github.ref`, so `concurrency` does not cancel the push run).
#
# The failure mode to keep in mind is the one that hit #158-#167: those came
# from automated branches that matched none of the globs, so each PR carried
# an EMPTY status and merged unbuilt — five mutually-incompatible dependency
# bumps that broke the Android build at Gradle configuration time on main.
# That specific hole is closed by the bot being gone (dependency updates are
# manual now), NOT by the trigger list. If any automation is reintroduced,
# add its branch prefix here in the same commit, or its PRs will be green by
# virtue of never having run.

# Least privilege for GITHUB_TOKEN. Without this the token inherits the
# repository/organization default, which on many repos is still read-write on
# contents, packages, issues and pull-requests — handed to every third-party
# action and to the Gradle build. Nothing in this workflow writes to the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Runner image: pinned to an explicit release instead of `ubuntu-latest`.
# The floating label was mid-migration from 24.04 to 26.04 (2026-10-19 to
# 2026-11-19, actions/runner-images#14748), so which image a run got depended
# on the day, and every job carried the migration warning. 26.04 ships what
# this workflow relies on: the Android SDK with the platform and build-tools
# this build compiles against, JDK 17 for setup-java to select (the image's own
# default is 25), and CPython 3.14 for setup-python. Bump the label on purpose,
# in all three jobs together.
jobs:
  changes:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      android: ${{ steps.filter.outputs.android }}
      server: ${{ steps.filter.outputs.server }}
    steps:
      # WHAT THIS GATES ON, because it is not what you would guess and the
      # comment here used to say otherwise. With no `base` input, paths-filter
      # compares the WHOLE BRANCH against the default branch, not the push:
      #   git merge-base origin/main origin/<branch>
      #   git diff --name-status origin/main...origin/<branch>
      # So gating is per-BRANCH. Once any commit on a branch touches
      # `android/**`, every later push on that branch runs the android job,
      # including a docs-only one. On `main` it behaves differently — the
      # branch being compared is the one that was pushed, so the action falls
      # back to `github.event.before` and gates per-push there.
      # That is a safety property, not a bug: a branch's head is always
      # verified against the tree it will actually merge with. The cost is
      # small because Gradle's build cache serves an unchanged variant in
      # about 90 seconds.
      #
      # fetch-depth: 0 is load-bearing either way, and this is the failure it
      # prevents. paths-filter needs the base object (the merge-base here,
      # `github.event.before` on main) present in the clone; with the default
      # depth-1 checkout it is not, so paths-filter shells out to `git fetch`
      # to get it. That fetch has no credentials (persist-credentials: false,
      # correctly, keeps the token out of .git/config) and dies with:
      #   fatal: could not read Username for 'https://github.com'
      # which failed the `changes` job and, through `needs:`, SKIPPED the
      # android and server jobs entirely. Every push to main since #158 was
      # "green" only because nothing ever ran.
      #
      # Fetching the full history makes the base commit already present, so
      # paths-filter never fetches and never needs a credential. The
      # alternative — re-enabling persist-credentials here — would put the
      # token back in .git/config to work around a missing object; this keeps
      # the hardening and fixes the actual cause. A partial clone (filter:
      # blob:none) would shave a few seconds but reintroduces lazy fetches
      # against that same credential-less remote, so it stays a full clone.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          # A workflow change intentionally selects every filter. This gives a
          # final CI-gate commit a complete matrix before APK distribution.
          filters: |
            android:
              - 'android/**'
              - 'account-server/app/api/**'
              - 'account-server/app/security/tokens.py'
              - '.github/workflows/**'
              - 'DEPLOYMENT.md'
              - 'privacy.html'
            server:
              - 'server/**'
              - 'account-server/**'
              - 'deploy/account-beta-test/**'
              - '.github/workflows/**'
              - 'DEPLOYMENT.md'
              - 'privacy.html'

  # Single runner, single Gradle invocation. Measured on the earlier serial
  # version of this job (cold cache, 2-core private runner): a
  # "zero-configuration" step of ~10m36 plus a main step of ~24m. What was
  # wasted, and is now gone:
  #
  #   1. The zero-configuration step built and tested debug + staging WITHOUT
  #      the FCM_* env, then the main step did it again WITH it. FCM_* are
  #      BuildConfig fields, so the second pass had different inputs for
  #      compile and for every test task: nothing was reusable and both
  #      variants' whole suites ran twice. There is now one invocation, with no
  #      -P flags, so it is itself the zero-config proof (committed defaults
  #      select the live beta pair and the pinned Yandex client).
  #   2. The ~94-class shared Robolectric suite ran on all five variants
  #      although it is the same tests. Only src/testDebug, src/testRelease,
  #      src/testStaging and src/testRecovery* differ per variant, so the full
  #      suite runs on debug and on release (what ships); staging and the
  #      recovery variants run just their own identity test. `--tests` binds to
  #      the task before it and fails loudly ("no tests found") if the class
  #      is renamed away.
  #   3. A second Gradle start (configuration, task graph, daemon) between the
  #      two steps.
  #
  # One invocation also lets Gradle schedule all variants together: the
  # R8 passes (~5 min each, CPU-bound) overlap the test tasks instead of
  # queueing behind them.
  android:
    name: Android build & lint
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: android
    # This job is deliberately credential-free. It produces compilation/test
    # evidence only; release signing is done locally by the owner.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Stops checkout from writing the GITHUB_TOKEN into .git/config, where
          # it stays readable by every subsequent step — including the Gradle
          # build and its plugins.
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      # The runner image already ships the Android SDK: cmdline-tools/latest,
      # build-tools (apksigner) and the platforms this build compiles against.
      # So this step exists for ONE reason — accepting the SDK licences, which
      # is what lets AGP fetch a platform itself if the image ever drifts
      # behind compileSdk. Both inputs below are non-default and deliberate:
      #
      #   packages: ''  — the default is `tools platform-tools`, and `tools` is
      #     SDK Tools 26.0.0: monkeyrunner, hierarchyviewer, jython, SWT, the
      #     old `android` script. Deprecated for years, ~15s to download and
      #     unzip every run, and touched by neither an AGP build nor apksigner.
      #     platform-tools (adb) is only for on-device work, which CI never
      #     does — connectedDebugAndroidTest is deliberately not run here.
      #   log-accepted-android-sdk-licenses: false — the licences are still
      #     accepted, just not echoed. The default dumped ~1,000 lines of
      #     Google TV and Android XR licence text over the build output.
      #
      # Together these took the step from 21s to 7s.
      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          cmdline-tools-version: latest
          packages: ''
          log-accepted-android-sdk-licenses: false

      # gradle-wrapper.jar is committed executable code that runs before the
      # build. Validate it against Gradle's published known-good checksums.
      # The action scans the whole checkout, so
      # it finds android/gradle/ regardless of this job's
      # `defaults.run.working-directory` (which applies to `run:` steps only).
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      # Restores the Gradle home (dependencies + local build cache) and reuses
      # it across runs, so unchanged modules/tasks aren't recompiled. Replaces
      # the hand-rolled actions/cache step and manages the Gradle daemon.
      # Pinned to v6 (latest): v5+ runs on Node 24, clearing the Node 20
      # runtime deprecation warning that v4 emitted.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-provider: basic

      # Robolectric resolves its `android-all-instrumented` jars at TEST
      # RUNTIME through its own Maven resolver, into ~/.m2/repository — not
      # through Gradle, so setup-gradle's Gradle-home cache never covered them
      # and every run re-downloaded the lot. Measured at 338 MB on the first
      # run that saved this entry. Scoped to org/robolectric so it cannot
      # collide with the settings.xml/toolchains.xml setup-java writes beside
      # it. Keyed on build.gradle.kts (where the Robolectric version lives) so
      # a version bump refreshes it, with a prefix restore-key so an unrelated
      # edit to that file still restores the jars.
      - name: Cache Robolectric android-all jars
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('android/app/build.gradle.kts') }}
          restore-keys: robolectric-${{ runner.os }}-

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      # ktlint + detekt replace Android Lint as the code-quality gate.
      #
      # --configuration-cache is a compatibility gate here rather than a
      # speed win: the entry lives in the project's own .gradle/ directory,
      # which setup-gradle does not cache (caching it would need a
      # `cache-encryption-key`, and a config-cache entry can capture values read
      # during configuration). Kept because Gradle 10 makes the config cache
      # mandatory and this catches an incompatible change on the commit that
      # introduces it.
      - name: Build and test (zero-configuration Yandex beta build mode)
        env:
          # FCM client config (optional). Unset ⇒ push stays dormant and the
          # client falls back to polling (PushManager.isConfigured).
          FCM_APP_ID: ${{ secrets.FCM_APP_ID }}
          FCM_API_KEY: ${{ secrets.FCM_API_KEY }}
          FCM_PROJECT_ID: ${{ secrets.FCM_PROJECT_ID }}
          FCM_SENDER_ID: ${{ secrets.FCM_SENDER_ID }}
        run: >-
          ./gradlew ktlintCheck detekt
          testDebugUnitTest
          testReleaseUnitTest
          testStagingUnitTest --tests '*StagingBuildIdentityTest'
          testRecoveryProductionUnitTest --tests '*RecoveryBuildIdentityTest'
          testRecoveryStagingUnitTest --tests '*RecoveryBuildIdentityTest'
          assembleRelease assembleStaging
          assembleRecoveryProduction assembleRecoveryStaging
          --build-cache --configuration-cache --stacktrace

      # Only the JUnit XML and the packaging logs live outside build/reports.
      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-build-reports
          path: |
            android/app/build/reports/**
            android/app/build/test-results/**
            android/app/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7

      # A test build, not a distributable one: this job has no signing key, so
      # the APK carries the runner's throwaway debug certificate and the
      # staging endpoints. It cannot update an install signed by another key,
      # and Yandex sign-in rejects its certificate. An APK is already a zip,
      # hence the light compression level.
      - name: Upload release APK (debug-signed, staging endpoints)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 3

  server:
    name: Server + account tests & lint (py3.14)
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The server is deployed straight onto a host (`start.sh` → uvicorn),
      # so the interpreter is whatever `python3` resolves to there rather
      # than something a base image pins. We stand at the single current
      # release (3.14) instead of testing a floor+latest range — this
      # assumes deploy hosts track the latest interpreter rather than
      # staying pinned to an older one. If that assumption stops holding,
      # reintroduce a floor leg here (and in requirements.txt's numpy floor
      # / pyproject.toml's ruff target-version, which moved in lockstep).
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-dev.txt
            account-server/requirements.txt

      # No `pip install --upgrade pip` first: setup-python ships a current pip
      # and the upgrade only bought a wheel download and a version check.
      # requirements-dev.txt also pulls in ../account-server/requirements.txt: the
      # account service's tests live in server/tests/account and share this run.
      - name: Install server + account + dev dependencies
        run: pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check . ../account-server

      # -n auto: one pytest-xdist worker per core. The suite has no slow test to
      # single out — its time is ~1,300 small tests — so fanning them out is
      # what shortens it.
      - name: Run tests (pytest)
        run: pytest tests -q -n auto

name: ci

on:
  # Push-only. Work happens on claude/** branches, so a push already
  # covers both the pre-PR window and every later PR update — the check
  # runs attach to the commit and show on the PR. The pull_request
  # trigger was dropped because it re-ran the whole suite for the same
  # commit once a PR was open, doubling a commit's checks (push +
  # pull_request). Re-add `pull_request:` only if you need CI on PRs from
  # forks or branches that don't match the patterns below.
  push:
    branches: [main, master, "claude/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.filter.outputs.android }}
      server: ${{ steps.filter.outputs.server }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            android:
              - 'android/**'
              - '.github/workflows/ci.yml'
            server:
              - 'server/**'
              - '.github/workflows/ci.yml'

  android:
    name: Android build & lint
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: latest

      - name: Gradle cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      - name: Run lintDebug
        run: ./gradlew lintDebug --stacktrace --no-daemon

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon

      # Only the release variant is packaged: it's smaller (R8 minification +
      # resource shrinking) and it's the one that ships, so it's also the only
      # build worth validating end-to-end. R8 is the only build that can break
      # on a bad ProGuard rule — e.g. a stripped Gson/Retrofit reflection
      # class — so packaging debug would just cost minutes without catching
      # anything the release build doesn't. No keystore in CI, so the build
      # falls back to the debug signing key (see app/build.gradle.kts) —
      # producing a debug-SIGNED, R8-minified APK that both validates the R8
      # config AND is installable for sideload testing. (lintDebug +
      # testDebugUnitTest above already compile the debug sources, so debug
      # compilation is still covered.)
      - name: Assemble release APK (R8 minification)
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: |
            android/app/build/reports/lint-results-*.html
            android/app/build/reports/lint-results-*.xml
          if-no-files-found: ignore

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-report
          path: |
            android/app/build/reports/tests/testDebugUnitTest/**
            android/app/build/test-results/testDebugUnitTest/**
          if-no-files-found: ignore

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports
          path: |
            android/app/build/reports/**
            android/app/build/outputs/logs/**
          if-no-files-found: ignore

      - name: Upload release APK (unsigned, minified)
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

  server:
    name: Server tests & lint
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-dev.txt

      - name: Install CPU-only PyTorch
        run: |
          pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install server + dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests (pytest)
        run: pytest tests -q

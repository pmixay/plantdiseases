# Automated dependency updates.
#
# Added as the systemic fix from the August 2026 security audit: every finding
# in that pass was drift, not a design flaw — Pillow sat on 26 published
# advisories, the Docker base image was six CPython patch releases behind, the
# committed Gradle wrapper was from an older Gradle line, and ~30 Android
# dependencies had newer stable releases. Nothing here was noticed because
# nothing was watching. Dependabot is what keeps the next six months from
# repeating it.
#
# Grouping keeps the PR volume survivable: one PR per ecosystem per week for
# routine bumps, but security updates always arrive as their own PR so they are
# never queued behind a noisy group.
version: 2

updates:
  # ── Server: FastAPI + ONNX Runtime inference API ────────────────────
  - package-ecosystem: pip
    directory: /server
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # numpy 2.5+ requires Python >= 3.12; this service runs on 3.11 (see
      # server/Dockerfile). Dependabot cannot see that constraint from the
      # requirement alone, so hold the major line here rather than take a PR
      # that cannot resolve.
      - dependency-name: numpy
        versions: [">=2.5"]

  # ── Account API ────────────────────────────────────────────────────
  - package-ecosystem: pip
    directory: /account-server
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      account-python-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # ── Android client ──────────────────────────────────────────────────
  # Kotlin, KSP and the serialization plugin/runtime must move in lockstep
  # (see android/build.gradle.kts), and Hilt's kotlin-stdlib floor is tied to
  # the Kotlin compiler version — so majors are reviewed by hand.
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      androidx:
        patterns: ["androidx.*"]
        update-types: [minor, patch]
      test-libraries:
        patterns:
          - "junit:*"
          - "org.robolectric:*"
          - "com.google.truth:*"
          - "androidx.test*"
    ignore:
      - dependency-name: org.jetbrains.kotlin*
        update-types: [version-update:semver-major]
      - dependency-name: com.google.devtools.ksp*
        update-types: [version-update:semver-major]
      - dependency-name: org.jetbrains.kotlinx:kotlinx-serialization-json
        update-types: [version-update:semver-major]

  # ── Container base image ────────────────────────────────────────────
  - package-ecosystem: docker
    directory: /server
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /account-server
    schedule:
      interval: weekly

  # Compose is a distinct Dependabot ecosystem; using `docker` here would scan
  # only Dockerfiles and silently leave deployed Compose image pins unmonitored.
  - package-ecosystem: docker-compose
    directory: /server
    schedule:
      interval: weekly

  # The pinned account-system Postgres runtime also lives in Compose.
  # Compose is a distinct Dependabot ecosystem; using `docker` here would scan
  # only Dockerfiles and silently leave the deployed digest unmonitored.
  - package-ecosystem: docker-compose
    directory: /deploy/account-beta-test
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /deploy/account-beta-test/handoff
    schedule:
      interval: weekly

  # ── CI actions ──────────────────────────────────────────────────────
  # The protected signing workflow pins actions to reviewed commits. Dependabot
  # keeps those immutable pins current without returning to mutable major tags.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

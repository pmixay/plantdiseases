# Include inside the reviewed Russian TLS server. Define these zones once in
# nginx's http context:
# limit_req_zone $binary_remote_addr zone=plantdisease_ru_account:10m rate=5r/s;
# limit_req_zone $binary_remote_addr zone=plantdisease_ru_app:10m rate=15r/s;

# Internal service credentials are never accepted at the public edge. The more
# specific prefix locations win over the public API locations below.
location ^~ /id/v1/internal/ {
    return 404;
}

location ^~ /api/internal/ {
    return 404;
}

location = /id {
    return 308 /id/;
}

# RuStore publishes these callback source networks. Re-verify them against the
# current server-notification documentation at every release; all other source
# addresses fail at the edge before body parsing or AES-GCM work.
location = /id/v1/billing/rustore/notifications {
    allow 95.163.133.0/30;
    allow 85.198.107.0/24;
    allow 79.137.140.128/26;
    deny all;

    access_log off;
    limit_req zone=plantdisease_ru_account burst=10 nodelay;
    limit_req_status 429;
    client_max_body_size 96k;
    client_body_timeout 3s;

    proxy_http_version 1.1;
    proxy_pass http://ru-account-api:8000/v1/billing/rustore/notifications;
    proxy_next_upstream off;
    proxy_connect_timeout 2s;
    proxy_send_timeout 3s;
    proxy_read_timeout 5s;

    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Prefix /id;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP "";
    proxy_set_header X-Request-ID "";
    proxy_set_header X-Internal-Service-Token "";
    proxy_hide_header Server;
}

location /id/ {
    limit_req zone=plantdisease_ru_account burst=10 nodelay;
    limit_req_status 429;
    error_page 429 = @plantdisease_rate_limited;
    client_max_body_size 96k;

    proxy_http_version 1.1;
    proxy_pass http://ru-account-api:8000/;
    proxy_next_upstream off;
    proxy_connect_timeout 3s;
    proxy_send_timeout 15s;
    proxy_read_timeout 30s;

    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Prefix /id;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP "";
    proxy_set_header X-Request-ID "";
    proxy_set_header X-Internal-Service-Token "";
    proxy_hide_header Server;
}

location / {
    limit_req zone=plantdisease_ru_app burst=25 nodelay;
    limit_req_status 429;
    error_page 429 = @plantdisease_rate_limited;
    client_max_body_size 12m;

    proxy_http_version 1.1;
    proxy_pass http://ru-app-api:8000/;
    proxy_next_upstream off;
    proxy_connect_timeout 3s;
    proxy_send_timeout 30s;
    proxy_read_timeout 90s;

    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP "";
    proxy_set_header X-Request-ID "";
    proxy_set_header X-Internal-Service-Token "";
    proxy_hide_header Server;
}

location @plantdisease_rate_limited {
    default_type application/json;
    add_header Retry-After 1 always;
    return 429 '{"detail":"rate_limited"}';
}


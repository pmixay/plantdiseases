# Contract template, not a deployment authorization. The worker image is an
# extraction deliverable and must pass the handoff checklist before use.
name: ${DE_ML_COMPOSE_PROJECT_NAME:?Set a dedicated German worker project name}

services:
  de-ml-worker:
    image: ${DE_ML_WORKER_IMAGE:?Set an immutable digest-pinned worker image}
    environment:
      ENVIRONMENT: production
      PERSISTENCE_ENABLED: "false"
      REQUEST_IMAGE_STORAGE: memory-only
      TEMPORARY_DIRECTORY: /tmp
      ACCESS_LOG_ENABLED: "false"
      REQUEST_BODY_LOG_ENABLED: "false"
      METRICS_LABEL_POLICY: aggregate-only
      ALLOWED_REQUEST_FIELDS: image,request_id,model_family,language,result_options
      MAX_FILE_SIZE: "10485760"
      MAX_IMAGE_DIMENSION: "4096"
      MODEL_DIRECTORY: /models
      TLS_CA_FILE: /run/ml-secrets/ru-client-ca.pem
      TLS_CERT_FILE: /run/ml-secrets/worker.pem
      TLS_KEY_FILE: /run/ml-secrets/worker.key
    ports:
      - name: private-mtls
        target: 8443
        published: ${DE_ML_PORT:?Set the private worker port}
        host_ip: ${DE_ML_BIND_IP:?Set the private tunnel address, never a public wildcard}
        protocol: tcp
    volumes:
      - ${DE_ML_MODEL_DIR:?Set the read-only model directory}:/models:ro
      - ${DE_ML_SECRETS_DIR:?Set the worker-owned mode-0400 secret directory}:/run/ml-secrets:ro
    networks:
      - worker-edge
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-m", "worker.healthcheck", "--url", "https://127.0.0.1:8443/health"]
      interval: 15s
      timeout: 3s
      retries: 5
    logging:
      driver: local
      options:
        max-size: 5m
        max-file: "2"

networks:
  worker-edge: {}

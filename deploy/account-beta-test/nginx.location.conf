# Include inside the existing TLS `server {}` only after defining these zones
# once in nginx's `http {}` context:
#
# limit_req_zone $binary_remote_addr zone=plantdisease_beta_account:1m rate=5r/s;
# limit_req_zone $binary_remote_addr zone=plantdisease_beta_app:1m rate=15r/s;
#
# The exact account prefix is intentionally declared before the application
# prefix. Neither upstream has a fallback to the production service.

location = /plantdisease-test/id {
    return 308 /plantdisease-test/id/;
}

location ^~ /plantdisease-test/id/v1/internal/ {
    return 404;
}

location ^~ /plantdisease-test/api/internal/ {
    return 404;
}

# Sandbox notifications use the same published RuStore source networks as the
# production callback. This exact location deliberately bypasses the human
# tester allowlist but nothing else under the beta prefix does.
location = /plantdisease-test/id/v1/billing/rustore/notifications {
    allow 95.163.133.0/30;
    allow 85.198.107.0/24;
    allow 79.137.140.128/26;
    deny all;

    access_log off;
    error_log /var/log/nginx/plantdisease-beta-account-error.log crit;
    limit_req zone=plantdisease_beta_account burst=10 nodelay;
    limit_req_status 429;
    client_max_body_size 96k;
    client_body_timeout 3s;

    proxy_http_version 1.1;
    proxy_pass http://127.0.0.1:18101/v1/billing/rustore/notifications;
    proxy_next_upstream off;
    proxy_connect_timeout 2s;
    proxy_send_timeout 3s;
    proxy_read_timeout 5s;

    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Prefix /plantdisease-test/id;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP "";
    proxy_set_header X-Request-ID "";
    proxy_set_header X-Internal-Service-Token "";
    proxy_hide_header Server;
}

location ^~ /plantdisease-test/id/ {
    access_log off;
    error_log /var/log/nginx/plantdisease-beta-account-error.log crit;

    # This separately provisioned file must contain exact named-tester or
    # controlled VPN egress addresses and end in `deny all`. A missing file
    # makes `nginx -t` fail closed. EMAIL_PASSWORD_AUTH_ENABLED is not an
    # ingress access-control mechanism.
    include /etc/nginx/plantdisease-beta-testers.allow;

    limit_req zone=plantdisease_beta_account burst=10 nodelay;
    limit_req_status 429;
    error_page 429 = @plantdisease_beta_rate_limited;
    client_max_body_size 96k;
    client_body_timeout 10s;

    proxy_http_version 1.1;
    proxy_pass http://127.0.0.1:18101/;
    proxy_next_upstream off;
    proxy_connect_timeout 3s;
    proxy_send_timeout 15s;
    proxy_read_timeout 30s;

    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Prefix /plantdisease-test/id;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP "";
    proxy_set_header X-Request-ID "";
    proxy_set_header X-Internal-Service-Token "";
    proxy_hide_header Server;
}

location = /plantdisease-test {
    return 308 /plantdisease-test/;
}

location ^~ /plantdisease-test/ {
    access_log off;
    error_log /var/log/nginx/plantdisease-beta-app-error.log crit;

    include /etc/nginx/plantdisease-beta-testers.allow;

    limit_req zone=plantdisease_beta_app burst=25 nodelay;
    limit_req_status 429;
    error_page 429 = @plantdisease_beta_rate_limited;
    client_max_body_size 12m;
    client_body_timeout 20s;

    proxy_http_version 1.1;
    proxy_pass http://127.0.0.1:18100/;
    proxy_next_upstream off;
    proxy_connect_timeout 3s;
    proxy_send_timeout 30s;
    proxy_read_timeout 90s;

    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Prefix /plantdisease-test;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP "";
    proxy_set_header X-Request-ID "";
    proxy_set_header X-Internal-Service-Token "";
    proxy_hide_header Server;
}

location @plantdisease_beta_rate_limited {
    default_type application/json;
    add_header Retry-After 1 always;
    return 429 '{"detail":"rate_limited"}';
}

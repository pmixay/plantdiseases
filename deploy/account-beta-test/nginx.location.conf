# Include inside the existing TLS `server {}` only after defining these zones
# once in nginx's `http {}` context:
#
# limit_req_zone $binary_remote_addr zone=plantdisease_beta_account:1m rate=5r/s;
# limit_req_zone $binary_remote_addr zone=plantdisease_beta_app:1m rate=15r/s;
#
# The exact account prefix is intentionally declared before the application
# prefix. Neither upstream has a fallback to the production service.

location = /plantdisease-test/id {
    return 308 /plantdisease-test/id/;
}

location ^~ /plantdisease-test/id/ {
    access_log off;
    error_log /var/log/nginx/plantdisease-beta-account-error.log crit;

    limit_req zone=plantdisease_beta_account burst=10 nodelay;
    client_max_body_size 64k;
    client_body_timeout 10s;

    proxy_http_version 1.1;
    proxy_pass http://127.0.0.1:18101/;
    proxy_next_upstream off;
    proxy_connect_timeout 3s;
    proxy_send_timeout 15s;
    proxy_read_timeout 30s;

    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Prefix /plantdisease-test/id;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP "";
    proxy_set_header X-Request-ID "";
    proxy_hide_header Server;
}

location = /plantdisease-test {
    return 308 /plantdisease-test/;
}

location ^~ /plantdisease-test/ {
    access_log off;
    error_log /var/log/nginx/plantdisease-beta-app-error.log crit;

    limit_req zone=plantdisease_beta_app burst=25 nodelay;
    client_max_body_size 12m;
    client_body_timeout 20s;

    proxy_http_version 1.1;
    proxy_pass http://127.0.0.1:18100/;
    proxy_next_upstream off;
    proxy_connect_timeout 3s;
    proxy_send_timeout 30s;
    proxy_read_timeout 90s;

    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Prefix /plantdisease-test;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP "";
    proxy_set_header X-Request-ID "";
    proxy_hide_header Server;
}

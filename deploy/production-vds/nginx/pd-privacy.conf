# Privacy policy at https://pdis.arbuz.lol/privacy.html (linked from the app's
# consent screen and the RuStore listing). Included in the TLS server block of
# /etc/nginx/sites-available/plantdiseases.conf, ahead of `location /`.
# Install: install -D -m 0644 privacy.html /var/www/pdis/privacy.html
location = /privacy.html {
    root /var/www/pdis;
    charset utf-8;
    expires 1h;
}

# Production routing for pdis.arbuz.lol (included inside the TLS server block, before `location /`).
# /id/ -> account API (loopback 18201), everything else keeps going through `location /` -> app (18200).
# Internal service routes are never reachable from outside. /id/ is public; the rate limit is its only gate.

location = /id {
    return 308 /id/;
}

location ^~ /id/v1/internal/ {
    return 404;
}

location ^~ /api/internal/ {
    return 404;
}

location = /id/docs { return 404; }
location = /id/docs/oauth2-redirect { return 404; }
location = /id/openapi.json { return 404; }

location ^~ /id/ {
    access_log off;
    error_log /var/log/nginx/pdis-prod-account-error.log crit;

    limit_req zone=pdis_prod_account burst=10 nodelay;
    limit_req_status 429;
    error_page 429 = @pdis_prod_rate_limited;
    client_max_body_size 96k;
    client_body_timeout 10s;

    proxy_http_version 1.1;
    proxy_pass http://127.0.0.1:18201/;
    proxy_next_upstream off;
    proxy_connect_timeout 3s;
    proxy_send_timeout 15s;
    proxy_read_timeout 30s;

    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Prefix /id;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP "";
    proxy_set_header X-Request-ID "";
    proxy_set_header X-Internal-Service-Token "";
    proxy_hide_header Server;
}

location @pdis_prod_rate_limited {
    default_type application/json;
    add_header Retry-After 1 always;
    return 429 '{"detail":"rate_limited"}';
}

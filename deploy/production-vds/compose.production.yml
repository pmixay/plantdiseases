# DRAFT (not installed, not running). Operator-owned production stack for pdis.arbuz.lol
# on this VDS, derived from the reviewed compose.german-vds.yml. Differences from the beta:
#   * ENVIRONMENT=production, issuer https://pdis.arbuz.lol/id, root path /id
#   * production role contract (account_bootstrap/migrator/runtime/backup, database plantdisease)
#   * AI/push credentials only as mode-0400 files, app secrets in a mounted config file
#   * no keygen service (keys come from provision_keys.py, never from the test generator)
# Everything else (read-only roots, cap_drop, loopback-only ports, limits, local logs,
# separate private network) is kept as in the beta file.

name: ${PROD_PROJECT:?Set the production Compose project name}

x-logging: &logging
  driver: local
  options:
    max-size: 5m
    max-file: "3"

x-account-environment: &account-environment
  ENVIRONMENT: production
  AUTH_PROVIDER_MODE: remote
  YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:?Set the Yandex client id}
  VKID_CLIENT_ID: ""
  EMAIL_PASSWORD_AUTH_ENABLED: "false"
  PROVIDER_HTTP_TIMEOUT_SECONDS: "5"
  ACCOUNT_ROOT_PATH: /id
  ACCOUNT_ISSUER: https://${PROD_PUBLIC_HOST:?Set the public host}/id
  ACCOUNT_AUDIENCE: plantdiseases-app
  ACCOUNT_DATABASE_LOCAL: "true"
  ACCOUNT_ALLOW_EPHEMERAL_KEYS: "false"
  ACCOUNT_SIGNING_KEY_FILE: /run/account-secrets/signing.json
  ACCOUNT_ENCRYPTION_KEY_FILE: /run/account-secrets/encryption.key
  INTERNAL_SERVICE_TOKEN_FILE: /run/internal-token/internal.token
  RUSTORE_LIFECYCLE_ENABLED: "false"
  RUSTORE_CHECKOUT_ENABLED: "false"
  RUSTORE_APPLICATION_ID: ""
  RUSTORE_KEY_ID: ""
  RUSTORE_PRIVATE_KEY_FILE: /run/rustore-secrets/private-key.b64
  RUSTORE_NOTIFICATION_KEY_FILE: /run/rustore-secrets/notification-key.b64
  RUSTORE_PACKAGE_NAME: com.plantdiseases.app
  RUSTORE_SUBSCRIPTION_PRODUCTS: plantdiseases_pro_monthly,plantdiseases_pro_yearly
  RUSTORE_ALLOW_SANDBOX: "false"
  RUSTORE_NOTIFICATION_KEY_EPOCH: production-v1
  RUSTORE_NOTIFICATION_MAX_ATTEMPTS: "8"
  RUSTORE_NOTIFICATION_MAX_AGE_HOURS: "168"
  ENTITLEMENT_QUOTA_POLICY_VERSION: launch-2026-08-v1
  ENTITLEMENT_FREE_DAILY_LIMITS: gamma_analysis=5,frontier_analysis=0,plant_identification=1,ai_doctor=3,care_plan=5
  ENTITLEMENT_PRO_DAILY_LIMITS: gamma_analysis=30,frontier_analysis=3,plant_identification=3,ai_doctor=15,care_plan=20
  # PlantNet stays denied until the owner approves a cohort budget (disabled = every
  # uncached PlantNet call is refused by the account-side budget authority).
  PLANTNET_BUDGET_ENABLED: "false"
  PLANTNET_BUDGET_POLICY_VERSION: launch-hold-v1
  PLANTNET_DAILY_ATTEMPT_LIMIT: "0"
  PLANTNET_ATTEMPT_COST_MICROS: "0"
  PLANTNET_DAILY_COST_LIMIT_MICROS: "0"
  COMMUNITY_DELETION_URL: http://prod-app-api:8000/api/internal/account-deletions
  CORS_ORIGINS: ""

services:
  prod-postgres:
    image: postgres:18.4-alpine3.23@sha256:996d0920e4ff9df1fc19dacb904492f3c1ec0ec1cc338f0ad7123be7731c5f5e
    environment:
      POSTGRES_DB: plantdisease
      POSTGRES_USER: account_bootstrap
      POSTGRES_PASSWORD: ${PROD_POSTGRES_ADMIN_PASSWORD:?Set the bootstrap password}
      ACCOUNT_POSTGRES_RUNTIME_PASSWORD: ${PROD_POSTGRES_RUNTIME_PASSWORD:?Set the runtime password}
      ACCOUNT_POSTGRES_MIGRATOR_PASSWORD: ${PROD_POSTGRES_MIGRATOR_PASSWORD:?Set the migrator password}
      ACCOUNT_POSTGRES_BACKUP_PASSWORD: ${PROD_POSTGRES_BACKUP_PASSWORD:?Set the backup password}
      PGDATA: /var/lib/postgresql/18/docker
    expose:
      - "5432"
    volumes:
      - prod_postgres:/var/lib/postgresql
      - type: bind
        source: /opt/pd-account-prod/deploy/postgres-init
        target: /docker-entrypoint-initdb.d
        read_only: true
    networks:
      - prod-private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U account_bootstrap -d plantdisease"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    logging: *logging

  prod-account-role-provision:
    image: postgres:18.4-alpine3.23@sha256:996d0920e4ff9df1fc19dacb904492f3c1ec0ec1cc338f0ad7123be7731c5f5e
    entrypoint: ["/bin/sh", "/role-init/10-account-roles.sh"]
    environment:
      PGHOST: prod-postgres
      PGPORT: "5432"
      PGPASSWORD: ${PROD_POSTGRES_ADMIN_PASSWORD:?Set the bootstrap password}
      POSTGRES_DB: plantdisease
      POSTGRES_USER: account_bootstrap
      ACCOUNT_POSTGRES_RUNTIME_PASSWORD: ${PROD_POSTGRES_RUNTIME_PASSWORD:?Set the runtime password}
      ACCOUNT_POSTGRES_MIGRATOR_PASSWORD: ${PROD_POSTGRES_MIGRATOR_PASSWORD:?Set the migrator password}
      ACCOUNT_POSTGRES_BACKUP_PASSWORD: ${PROD_POSTGRES_BACKUP_PASSWORD:?Set the backup password}
    depends_on:
      prod-postgres:
        condition: service_healthy
    volumes:
      - /opt/pd-account-prod/deploy/postgres-init:/role-init:ro
    networks:
      - prod-private
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    restart: "no"
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 32
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *logging

  prod-account-migrate:
    image: ${PROD_ACCOUNT_IMAGE:?Set an immutable account image with an sha256 digest}
    environment:
      <<: *account-environment
      ACCOUNT_DATABASE_URL: postgresql+psycopg://account_migrator:${PROD_POSTGRES_MIGRATOR_PASSWORD:?Set the migrator password}@prod-postgres/plantdisease
    command:
      - /bin/sh
      - -ec
      - |
        python -m alembic upgrade head
        python /role-contract/converge-runtime-grants.py --contract production
    depends_on:
      prod-account-role-provision:
        condition: service_completed_successfully
    volumes:
      - prod_account_keys:/run/account-secrets:ro
      - prod_internal_token:/run/internal-token:ro
      - type: bind
        source: ${PROD_RUSTORE_SECRETS_DIR:?Set the account-owned RuStore secret directory}
        target: /run/rustore-secrets
        read_only: true
      - ./converge-runtime-grants.py:/role-contract/converge-runtime-grants.py:ro
    networks:
      - prod-private
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    restart: "no"
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *logging

  prod-account-api:
    image: ${PROD_ACCOUNT_IMAGE:?Set an immutable account image with an sha256 digest}
    environment:
      <<: *account-environment
      ACCOUNT_DATABASE_URL: postgresql+psycopg://account_runtime:${PROD_POSTGRES_RUNTIME_PASSWORD:?Set the runtime password}@prod-postgres/plantdisease
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --forwarded-allow-ips
      - ${PROD_FORWARDED_ALLOW_IPS:?Set the exact trusted Docker proxy peer IPs}
      - --proxy-headers
      - --no-access-log
      - --limit-concurrency
      - "64"
      - --timeout-keep-alive
      - "5"
    depends_on:
      prod-account-migrate:
        condition: service_completed_successfully
    volumes:
      - prod_account_keys:/run/account-secrets:ro
      - prod_internal_token:/run/internal-token:ro
      - type: bind
        source: ${PROD_RUSTORE_SECRETS_DIR:?Set the account-owned RuStore secret directory}
        target: /run/rustore-secrets
        read_only: true
    ports:
      - name: account-api
        target: 8000
        published: ${PROD_ACCOUNT_API_PORT:?Set the account loopback port}
        host_ip: 127.0.0.1
        protocol: tcp
    networks:
      - prod-private
      - prod-edge
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *logging

  prod-app-api:
    image: ${PROD_APP_IMAGE:?Set an immutable application image with an sha256 digest}
    environment:
      ENVIRONMENT: production
      PLANTDISEASES_CONFIG: /run/app-config/config.json
      ACCOUNT_FEATURE_EXPECTED: "true"
      APP_ROOT_PATH: ""
      POPULAR_WARM_ENABLED: "false"
      FRONTIER_ENABLED: "false"
      TRAINING_CAPTURE_ENABLED: "false"
      TRAINING_CONSENT_VERSION: model-improvement-v1
      TELEMETRY_ENABLED: "false"
      TELEMETRY_CONSENT_VERSION: telemetry-errors-v1
      ACCOUNT_API_BASE_URL: http://prod-account-api:8000/
      ACCOUNT_ISSUER: https://${PROD_PUBLIC_HOST:?Set the public host}/id
      ACCOUNT_AUDIENCE: plantdiseases-app
      ACCOUNT_INTERNAL_BASE_URL: http://prod-account-api:8000
      ACCOUNT_JWKS_URL: http://prod-account-api:8000/.well-known/jwks.json
      ACCOUNT_INTROSPECTION_URL: http://prod-account-api:8000/v1/internal/auth/verify
      ACCOUNT_NOTIFICATION_URL: ""
      INTERNAL_SERVICE_TOKEN_FILE: /run/internal-token/internal.token
      MODELS_DIR: /app/models
      AQUA_STATIC_DIR: /app/models/aqua
      ONNX_INTRA_OP_THREADS: "1"
      INFER_WORKERS: "1"
      LOG_DIR: /data/logs
      COMMUNITY_DB_PATH: /data/community/community.db
      COMMUNITY_THUMB_DIR: /data/community-thumbs
      TRAINING_DB_PATH: /data/training/training.db
      TRAINING_IMAGE_DIR: /data/training-images
      TELEMETRY_DB_PATH: /data/telemetry/telemetry.db
      PLANT_PHOTO_CACHE_DIR: /data/app-cache/plant-photos
      AI_CACHE_DIR: /data/app-cache/ai
      # Credentials are mode-0400 files owned by the app uid; never environment values.
      PLANTNET_API_KEY_FILE: ""
      OPENROUTER_API_KEY_FILE: ${PROD_OPENROUTER_KEY_FILE:-}
      FCM_CREDENTIALS_FILE: ${PROD_FCM_CREDENTIALS_FILE:-}
      PUSH_DB_PATH: /data/legacy-push/push.db
      CORS_ORIGINS: ""
      TRUSTED_PROXIES: ${PROD_TRUSTED_PROXIES:?Set the exact trusted Docker proxy peer IPs}
      RATE_LIMIT_RPS: "25"
      RATE_LIMIT_BURST: "40"
    command:
      - uvicorn
      - main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --forwarded-allow-ips
      - ${PROD_FORWARDED_ALLOW_IPS:?Set the exact trusted Docker proxy peer IPs}
      - --proxy-headers
      - --no-access-log
      - --limit-concurrency
      - "32"
      - --timeout-keep-alive
      - "5"
    depends_on:
      prod-account-api:
        condition: service_healthy
    ports:
      - name: app-api
        target: 8000
        published: ${PROD_APP_API_PORT:?Set the application loopback port}
        host_ip: 127.0.0.1
        protocol: tcp
    volumes:
      - type: bind
        source: ${PROD_MODELS_DIR:?Set the absolute host directory containing the model bundle}
        target: /app/models
        read_only: true
      - type: bind
        source: ${PROD_APP_SECRETS_DIR:?Set the app-owned secrets directory}
        target: /run/app-secrets
        read_only: true
      - type: bind
        source: ${PROD_APP_CONFIG_DIR:?Set the directory holding config.json}
        target: /run/app-config
        read_only: true
      - prod_internal_token:/run/internal-token:ro
      - prod_app_data:/app/data
      - prod_community:/data/community
      - prod_thumbnails:/data/community-thumbs
      - prod_training:/data/training
      - prod_training_images:/data/training-images
      - prod_telemetry:/data/telemetry
      - prod_app_cache:/data/app-cache
      - prod_app_logs:/data/logs
      - prod_legacy_push:/data/legacy-push
    networks:
      - prod-edge
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    restart: unless-stopped
    mem_limit: 1536m
    memswap_limit: 1536m
    cpus: 0.5
    cpu_shares: 512
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    group_add:
      - "10002"
    cap_drop:
      - ALL
    logging: *logging

networks:
  prod-private:
    internal: true
  prod-edge:
    ipam:
      config:
        - subnet: ${PROD_EDGE_SUBNET:?Set the dedicated edge subnet}
          gateway: ${PROD_EDGE_GATEWAY:?Set the edge gateway address}

volumes:
  prod_postgres:
    name: ${PROD_VOLUME_PREFIX:?Set the volume prefix}_postgres
  prod_account_keys:
    name: ${PROD_VOLUME_PREFIX}_account_keys
  prod_internal_token:
    name: ${PROD_VOLUME_PREFIX}_internal_token
  prod_app_data:
    name: ${PROD_VOLUME_PREFIX}_app_data
  prod_community:
    name: ${PROD_VOLUME_PREFIX}_community
  prod_thumbnails:
    name: ${PROD_VOLUME_PREFIX}_thumbnails
  prod_training:
    name: ${PROD_VOLUME_PREFIX}_training
  prod_training_images:
    name: ${PROD_VOLUME_PREFIX}_training_images
  prod_telemetry:
    name: ${PROD_VOLUME_PREFIX}_telemetry
  prod_app_cache:
    name: ${PROD_VOLUME_PREFIX}_app_cache
  prod_app_logs:
    name: ${PROD_VOLUME_PREFIX}_app_logs
  prod_legacy_push:
    name: ${PROD_VOLUME_PREFIX}_legacy_push

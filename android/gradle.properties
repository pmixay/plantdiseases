org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
# Reuse task outputs across builds. In CI the Gradle home (incl. the local
# build cache) is restored by gradle/actions/setup-gradle, so unchanged
# modules/tasks are pulled from cache instead of re-run.
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Zero-configuration account beta defaults. These values are public mobile
# configuration, not credentials: a fresh checkout opened in Android Studio
# uses the live German beta application/account pair and the real Yandex SDK.
# Protected production builds override the app/account URLs together through
# environment variables; ACCOUNT_REAL_OAUTH=false remains an explicit opt-out
# for local mock-stack work and the account-disabled recovery variants.
ACCOUNT_REAL_OAUTH=true
STAGING_APP_API_BASE_URL=https://pdis.arbuz.lol/plantdisease-test/
STAGING_ACCOUNT_API_BASE_URL=https://pdis.arbuz.lol/plantdisease-test/id/

# ── AGP 9 opt-outs ───────────────────────────────────────────────────────
# Both of these are AGP 9 defaults we are deliberately NOT taking yet. Each
# is a migration in its own right; taking them silently as part of an AGP
# version bump would mean shipping two untested rewrites at once. Both flags
# are removed in AGP 10, so these are dated, not permanent.
#
# builtInKotlin: AGP 9 defaults to its own Kotlin support and REFUSES to run
# alongside the `org.jetbrains.kotlin.android` plugin. This project applies
# that plugin, and KSP (Room, Glide, Hilt) plus the serialization compiler
# plugin are wired through it. Opting out keeps the working toolchain; the
# migration is /build/migrate-to-built-in-kotlin.
android.builtInKotlin=false
# newDsl: AGP 9's new `android {}` interfaces change the shape of ordinary
# declarations — `minSdk = 29` becomes `minSdk { version = release(29) }`,
# and the old extension types this build's `signingConfigs.findByName(...)`
# and `testOptions.unitTests.all {}` rely on are gone. Rewriting the whole
# build script blind (nothing builds Android locally here — CI owns builds)
# is how you turn a dependency bump into a week of red CI.
android.newDsl=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

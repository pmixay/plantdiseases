distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# Held at 9.5.0 on purpose — this is the AGP ceiling, not staleness.
# Gradle 9.6.0 removed the internal API org.gradle.api.problems.internal.
# InternalProblems, which AGP 8.13.2 still depends on, so 9.6.x fails during
# plugin application with:
#   Plugin 'com.android.internal.application' relies on
#   'org.gradle.api.problems.internal.InternalProblems', a Gradle internal API
#   that was removed in Gradle 9.6.0.
# Moving past 9.5.0 requires the AGP 9 migration; do the two together.
distributionUrl=https\://services.gradle.org/distributions/gradle-9.5.0-bin.zip
# Integrity pin for the distribution the wrapper downloads. Without it the
# wrapper executes whatever bytes come back from the URL, so a compromised
# mirror or a MITM on a CI runner would run arbitrary code inside a build that
# has the release-signing and FCM secrets in its environment. Published by
# Gradle at https://services.gradle.org/distributions/gradle-9.5.0-bin.zip.sha256
# — update it in the same commit as any distributionUrl bump.
distributionSha256Sum=553c78f50dafcd54d65b9a444649057857469edf836431389695608536d6b746
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists

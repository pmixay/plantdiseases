# detekt configuration — layered on top of the bundled defaults
# (buildUponDefaultConfig = true). The goal is high-signal static analysis
# (potential bugs, coroutine misuse, performance), not style nitpicking —
# ktlint owns formatting. Rules that fight an Android view-binding app
# (magic dp/colour values, long UI-building methods) are relaxed so the
# report stays actionable.

build:
  maxIssues: 0
  excludeCorrectable: false

config:
  # Don't fail the run if a rule/property name drifts between detekt versions.
  # The gate itself is zero-tolerance (build.maxIssues: 0 above, detekt and
  # ktlint both ignoreFailures = false, both baselines empty) — this only stops
  # a config-schema mismatch on a rule-set bump from breaking CI.
  validation: false
  warningsAsErrors: false

comments:
  active: false

complexity:
  # These were all `active: false`, which is how 1500-line files grew while the
  # empty baselines advertised zero tolerance. They are back on, each threshold
  # pinned just ABOVE the worst case measured on this tree (detekt 1.23.8 over
  # src/main/java + src/test/java), so the gate is green today and only a
  # REGRESSION fails it (each threshold carries ~10% headroom over the
  # measured maximum, quoted per rule below). The numbers are a high-water
  # mark, not a target: ratchet each one down as the oversized files split.
  LongMethod:
    # Worst today: ui/result/ResultActivity.displayResult, 195 lines.
    active: true
    threshold: 210
    # data/GuideDataProvider.buildItems is 1520 lines of bilingual content
    # data, not logic; excluded so one content blob can't set the bar for
    # every real method. Drop the exclude when the guide text moves to
    # resources.
    excludes: ['**/GuideDataProvider.kt']
  LongParameterList:
    # Worst today: ScanRepository.uploadCommunityScan 14 params;
    # CareRepository's constructor 10.
    active: true
    functionThreshold: 16
    constructorThreshold: 12
  LargeClass:
    # Worst today: data/repository/ScanRepository, 1165 lines of class body
    # (GuideDataProvider's 1558 is excluded for the reason given above).
    active: true
    threshold: 1300
    excludes: ['**/GuideDataProvider.kt']
  TooManyFunctions:
    # Worst today: ScanRepository with 58 functions; 9 top-level functions in
    # ui/common/SectionUiKit.kt.
    active: true
    thresholdInFiles: 12
    thresholdInClasses: 65
    thresholdInObjects: 65
    thresholdInInterfaces: 65
    thresholdInEnums: 65
  CyclomaticComplexMethod:
    # Worst today: ResultActivity.displayResult, 41.
    active: true
    threshold: 50
  CognitiveComplexMethod:
    # Worst today: ResultActivity.displayResult, 56.
    active: true
    threshold: 65
  NestedBlockDepth:
    # Worst today: 5 (AquaModelManager.install, DoctorChatSheet.applyMarkdown).
    active: true
    threshold: 7

exceptions:
  TooGenericExceptionCaught:
    active: false
  SwallowedException:
    active: false
  TooGenericExceptionThrown:
    active: false

empty-blocks:
  EmptyFunctionBlock:
    active: true
    ignoreOverridden: true

naming:
  FunctionNaming:
    # Robolectric/JUnit test names trip the default pattern.
    active: true
    ignoreAnnotated: ['Test']

style:
  MagicNumber:
    active: false
  MaxLineLength:
    # ktlint owns line length.
    active: false
  ReturnCount:
    active: false
  WildcardImport:
    # ktlint's no-wildcard-imports covers this (and is relaxed in .editorconfig).
    active: false
  ForbiddenComment:
    active: false
  UnusedPrivateMember:
    # Noisy against view-binding / generated accessors.
    active: false
  UnusedPrivateProperty:
    active: false
  LoopWithTooManyJumpStatements:
    active: false

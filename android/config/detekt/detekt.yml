# detekt configuration — layered on top of the bundled defaults
# (buildUponDefaultConfig = true). The goal is high-signal static analysis
# (potential bugs, coroutine misuse, performance), not style nitpicking —
# ktlint owns formatting. Rules that fight an Android view-binding app
# (magic dp/colour values, long UI-building methods) are relaxed so the
# report stays actionable.

build:
  maxIssues: 0
  excludeCorrectable: false

config:
  # Don't fail the run if a rule/property name drifts between detekt versions.
  # The gate itself is zero-tolerance (build.maxIssues: 0 above, detekt and
  # ktlint both ignoreFailures = false, both baselines empty) — this only stops
  # a config-schema mismatch on a rule-set bump from breaking CI.
  validation: false
  warningsAsErrors: false

comments:
  active: false

complexity:
  # These were all `active: false`, which is how 1500-line files grew while the
  # empty baselines advertised zero tolerance. They are back on, each threshold
  # pinned just ABOVE the worst case measured on this tree (detekt 1.23.8 over
  # src/main/java + src/test/java), so the gate is green today and only a
  # REGRESSION fails it (each threshold carries ~10% headroom over the
  # measured maximum, quoted per rule below). The numbers are a high-water
  # mark, not a target: ratchet each one down as the oversized files split.
  LongMethod:
    # Worst today: ui/result/ResultActivity.displayResult, 197 lines.
    active: true
    threshold: 210
  LongParameterList:
    # Worst today: CommunityScanRepository.uploadCommunityScan and
    # OnboardingCatalog.step 11 params; the PlantRepository and CareRepository
    # constructors 10.
    active: true
    functionThreshold: 12
    constructorThreshold: 11
  LargeClass:
    # Worst today: ui/garden/detail/DetailExtraCardsController, 1103 lines of
    # class body; auth/AuthRepository 1098.
    active: true
    threshold: 1200
    # auth/AuthRepositoryTest is ~2160 lines of one-scenario-per-test cases
    # against a single class. Excluded by name rather than raising the bar to
    # 2400, which would stop this rule guarding production classes at all.
    # Drop the exclude when those cases split by concern (restore / refresh /
    # logout / signup).
    excludes: ['**/AuthRepositoryTest.kt']
  TooManyFunctions:
    # Worst today: ui/account/AccountActivity with 53 functions and
    # AuthRepository 52; the object di/AppModule 31; 9 top-level functions in
    # ui/common/SectionUiKit.kt.
    active: true
    thresholdInFiles: 12
    thresholdInClasses: 58
    thresholdInObjects: 35
    thresholdInInterfaces: 65
    thresholdInEnums: 65
  CyclomaticComplexMethod:
    # Worst today: ResultActivity.displayResult, 41.
    active: true
    threshold: 50
  CognitiveComplexMethod:
    # Worst today: AuthRepository.restore, 86 — one function walking every
    # stored-session recovery path (ResultActivity.displayResult is 56).
    active: true
    threshold: 95
  NestedBlockDepth:
    # Worst today: 5 (AquaModelManager.install, DoctorChatSheet.applyMarkdown).
    active: true
    threshold: 7
  ComplexCondition:
    # Left at detekt's default 4 until the account code arrived, and the rule
    # fires at >= threshold, so a 4-clause guard already tripped it. Worst
    # today: AccountActivity.emailAddressIsValid, 6 clauses; ProActivity's
    # billing-readiness guard, 4. Both are flat validation guards where
    # splitting the clauses into named predicates would read worse, not better.
    active: true
    threshold: 7

exceptions:
  TooGenericExceptionCaught:
    active: false
  SwallowedException:
    active: false
  TooGenericExceptionThrown:
    active: false

empty-blocks:
  EmptyFunctionBlock:
    active: true
    ignoreOverridden: true

naming:
  FunctionNaming:
    # Robolectric/JUnit test names trip the default pattern.
    active: true
    ignoreAnnotated: ['Test']

style:
  MagicNumber:
    active: false
  MaxLineLength:
    # ktlint owns line length.
    active: false
  ReturnCount:
    active: false
  WildcardImport:
    # ktlint's no-wildcard-imports covers this (and is relaxed in .editorconfig).
    active: false
  ForbiddenComment:
    active: false
  UnusedPrivateMember:
    # Noisy against view-binding / generated accessors.
    active: false
  UnusedPrivateProperty:
    active: false
  LoopWithTooManyJumpStatements:
    active: false

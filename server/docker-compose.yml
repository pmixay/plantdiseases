services:
  plantdiseases-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: plantdiseases-server
    ports:
      # Bound to loopback deliberately. DEPLOYMENT.md terminates TLS in nginx
      # in front of this container, so nothing outside the host should reach
      # uvicorn directly. Publishing on 0.0.0.0 (the "8000:8000" short form)
      # also bypasses a host firewall: Docker's DNAT rules sit in the DOCKER
      # chain, which is traversed before INPUT, so a ufw rule denying 8000
      # does not apply. Override PORT_BIND only for a host with no reverse
      # proxy in front of it.
      - "${PORT_BIND:-127.0.0.1}:8000:8000"
    volumes:
      # Mount a host ./models dir pre-populated with the trained artefacts
      # (detector.{pt,onnx}, classifier.onnx, classes.json, ...). Models are
      # NOT auto-downloaded; the server is fail-fast if they're missing.
      - ./models:/app/models
      - ./logs:/app/logs
      # Persistent data volume — every SQLite store, user-derived image,
      # thumbnail and cache is explicitly routed here below. Without this
      # mount a rebuild would wipe container-local data.
      - ./data:/app/data
    environment:
      # Restrict origins in production (comma separated list of explicit origins).
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      # Comma separated proxy IPs whose X-Forwarded-For header is trusted.
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-}
      - FORWARDED_ALLOW_IPS=${FORWARDED_ALLOW_IPS:-127.0.0.1}
      - RATE_LIMIT_RPS=${RATE_LIMIT_RPS:-1.0}
      - RATE_LIMIT_BURST=${RATE_LIMIT_BURST:-5}
      # Pin DB + thumbnail paths into the mounted volume so a
      # ``docker compose down && up`` keeps user data.
      - TRAINING_DB_PATH=${TRAINING_DB_PATH:-/app/data/training.db}
      - TRAINING_IMAGE_DIR=${TRAINING_IMAGE_DIR:-/app/data/training_images}
      - TRAINING_CAPTURE_ENABLED=${TRAINING_CAPTURE_ENABLED:-false}
      - TRAINING_CONSENT_VERSION=${TRAINING_CONSENT_VERSION:-model-improvement-v1}
      - COMMUNITY_DB_PATH=${COMMUNITY_DB_PATH:-/app/data/community.db}
      - COMMUNITY_THUMB_DIR=${COMMUNITY_THUMB_DIR:-/app/data/community_thumbs}
      - TELEMETRY_DB_PATH=${TELEMETRY_DB_PATH:-/app/data/telemetry.db}
      - TELEMETRY_CONSENT_VERSION=${TELEMETRY_CONSENT_VERSION:-telemetry-errors-v1}
      - PUSH_DB_PATH=${PUSH_DB_PATH:-/app/data/push.db}
      - PLANT_PHOTO_CACHE_DIR=${PLANT_PHOTO_CACHE_DIR:-/app/data/plant_photo_cache}
      # Persistent LLM result cache (species "common problems" + care plans).
      # Without this it defaults to /app/ai_cache on the container layer, which
      # a redeploy wipes — so every species goes cold again and the next open
      # re-pays the ~20 s OpenRouter call. Pin it onto /app/data so it survives
      # redeploys and is shared across replicas, like the DBs above.
      - AI_CACHE_DIR=${AI_CACHE_DIR:-/app/data/ai_cache}
      # Retention windows (days). Daily prune task wipes rows older
      # than these — adjust per your privacy policy.
      - TRAINING_RETENTION_DAYS=${TRAINING_RETENTION_DAYS:-90}
      - TRAINING_MAX_IMAGES=${TRAINING_MAX_IMAGES:-20000}
      - COMMUNITY_RETENTION_DAYS=${COMMUNITY_RETENTION_DAYS:-90}
      # Account support is explicitly disabled in this standalone compose.
      # To enable it, a production override must set EXPECTED=true, configure
      # every fixed account-service endpoint below, and mount a mode-0400/0640
      # shared service token at INTERNAL_SERVICE_TOKEN_FILE. Startup fails if
      # EXPECTED=true and that contract is incomplete.
      - ACCOUNT_FEATURE_EXPECTED=${ACCOUNT_FEATURE_EXPECTED:-false}
      - ACCOUNT_API_BASE_URL=${ACCOUNT_API_BASE_URL:-}
      - ACCOUNT_ISSUER=${ACCOUNT_ISSUER:-}
      - ACCOUNT_AUDIENCE=${ACCOUNT_AUDIENCE:-}
      - ACCOUNT_INTERNAL_BASE_URL=${ACCOUNT_INTERNAL_BASE_URL:-}
      - ACCOUNT_JWKS_URL=${ACCOUNT_JWKS_URL:-}
      - ACCOUNT_INTROSPECTION_URL=${ACCOUNT_INTROSPECTION_URL:-}
      - ACCOUNT_NOTIFICATION_URL=${ACCOUNT_NOTIFICATION_URL:-}
      - INTERNAL_SERVICE_TOKEN_FILE=${INTERNAL_SERVICE_TOKEN_FILE:-}
    restart: unless-stopped
    # The container already runs as the unprivileged `plantd` user (Dockerfile).
    # no-new-privileges stops any setuid binary inside the image from being used
    # to regain them, and the memory cap bounds the blast radius of a
    # decompression-bomb / oversized-image request to this container instead of
    # letting the host OOM-killer pick a victim.
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: ${MEM_LIMIT:-4g}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health', timeout=2).status == 200 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      # First /api/health probe after deploy must clear the cold model
      # load (~18 s observed). Models are mounted from ./models (not
      # downloaded), so no first-boot fetch window is needed.
      start_period: 30s

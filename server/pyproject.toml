[tool.ruff]
line-length = 110
target-version = "py314"
extend-exclude = [
    "train_notebook.ipynb",
    ".venv",
    "venv",
    "logs",
    "models",
]

[tool.ruff.lint]
# Deliberately NOT RUF100 (unused-noqa): ruff 0.15 reports the `# noqa: E402`
# directives on the sys.path-preamble imports (tools/export_data.py,
# tests/test_paired_eval.py) as unused even though dropping them makes E402
# fire, so `--fix` would strip live suppressions and turn the gate red. The
# tree's other suppression comments name rules nothing here runs (BLE001,
# S608, PLC0415) — they are intent notes for a future rule set, not gates. The
# two leftover wemake-python-styleguide `# noqa: WPS433` directives were
# dropped: there is no flake8/wemake dependency in the tree, so they never
# suppressed anything and ruff cannot adjudicate them.
select = ["E", "F", "I", "B"]
ignore = [
    "E501",  # line-length warnings are informational only; formatter handles it
    "B008",  # FastAPI relies on Depends()/File() defaults being called at function definition
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B"]

[tool.pytest.ini_options]
# Every warning is an error, so a new one fails CI instead of scrolling past in
# the summary. Fix the cause (migrate off the deprecated API, close the
# resource); a test that provokes a warning on purpose asserts it with
# `pytest.warns` or routes it into a recorder. Do not add `ignore` entries here.
filterwarnings = ["error"]

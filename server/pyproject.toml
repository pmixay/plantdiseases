[tool.ruff]
line-length = 110
target-version = "py314"
extend-exclude = [
    "train_notebook.ipynb",
    ".venv",
    "venv",
    "logs",
    "models",
]

[tool.ruff.lint]
# Deliberately NOT RUF100 (unused-noqa): ruff 0.15 reports the `# noqa: E402`
# directives on the sys.path-preamble imports (tools/export_data.py,
# tests/test_paired_eval.py) as unused even though dropping them makes E402
# fire, so `--fix` would strip live suppressions and turn the gate red. The
# tree's other suppression comments name rules nothing here runs (BLE001,
# S608, PLC0415) — they are intent notes for a future rule set, not gates. The
# two leftover wemake-python-styleguide `# noqa: WPS433` directives were
# dropped: there is no flake8/wemake dependency in the tree, so they never
# suppressed anything and ruff cannot adjudicate them.
select = ["E", "F", "I", "B"]
ignore = [
    "E501",  # line-length warnings are informational only; formatter handles it
    "B008",  # FastAPI relies on Depends()/File() defaults being called at function definition
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B"]

[tool.pytest.ini_options]
# Every warning is an error, so a new one fails CI instead of scrolling past in
# the summary. Fix the cause (migrate off the deprecated API, close the
# resource); a test that provokes a warning on purpose asserts it with
# `pytest.warns` or routes it into a recorder. Do not add `ignore` entries here.
filterwarnings = ["error"]

[tool.mypy]
# Run from the REPO ROOT, as `mypy --config-file server/pyproject.toml`: the
# server is also a package (`server.*`), and that is the spelling mypy checks.
# main.py and friends import `from .x import ...` first and fall back to the flat
# `from x import ...` that `uvicorn main:app` (run from server/) needs. Checking
# in flat mode is impossible (relative imports have no parent module), and
# checking both spellings at once reports every file twice, so only the
# package branch is typed and the flat names are Any (overrides below).
# tests/ and tools/ are excluded for now.
python_version = "3.14"
packages = ["server"]
exclude = ["(^|/)tests/", "(^|/)tools/", "(^|/)\\.?venv/", "(^|/)models/", "(^|/)logs/"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true

# The flat fallback spelling (`import config`) does not resolve when mypy runs on
# the `server.*` package. Per-module only; never a global ignore_missing_imports.
[[tool.mypy.overrides]]
module = ["account_auth", "account_entitlements", "account_internal", "account_roles", "ai_services", "analysis", "analysis_payload", "app_version", "beta_runtime", "bundle", "care_plan", "care_plan_content", "classifier", "community", "community_achievements", "community_deletion", "community_feeds", "community_forum", "community_geo", "community_http", "community_labels", "community_moderation", "community_popular", "community_safety", "community_scans", "community_views", "config", "conformal", "countries", "deps", "detector", "diseases_data", "feedback_labels", "main", "ood", "pipeline", "plant_doctor", "plant_photos", "plantnet", "plantnet_budget", "popular_bundle", "popular_plants", "progression", "routes_admin_panel", "routes_assistant", "routes_community", "routes_content", "routes_diagnosis", "routes_forum", "routes_internal", "routes_legacy_app", "routes_meta", "routes_moderation", "runtime_paths", "species_ai", "species_info", "sqlite_store", "symptoms", "synthetic_pipeline", "telemetry", "text_style", "training_store", "wikimedia_http"]
ignore_missing_imports = true

# The `except ImportError` fallback re-imports the same names, which mypy reports
# as no-redef in each module that has one.
[[tool.mypy.overrides]]
module = ["server.account_entitlements", "server.account_roles", "server.ai_services", "server.analysis", "server.analysis_payload", "server.care_plan", "server.classifier", "server.community", "server.community_achievements", "server.community_deletion", "server.community_feeds", "server.community_forum", "server.community_geo", "server.community_labels", "server.community_moderation", "server.community_popular", "server.community_safety", "server.community_scans", "server.community_views", "server.detector", "server.feedback_labels", "server.main", "server.pipeline", "server.plant_doctor", "server.plant_photos", "server.plantnet", "server.plantnet_budget", "server.popular_bundle", "server.routes_admin_panel", "server.routes_assistant", "server.routes_community", "server.routes_content", "server.routes_diagnosis", "server.routes_forum", "server.routes_internal", "server.routes_meta", "server.routes_moderation", "server.species_ai", "server.species_info", "server.telemetry", "server.training_store", "server.wikimedia_http"]
disable_error_code = ["no-redef"]

# No type information shipped.
[[tool.mypy.overrides]]
module = ["onnxruntime", "onnxruntime.*", "firebase_admin", "firebase_admin.*"]
ignore_missing_imports = true
